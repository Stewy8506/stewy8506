<svg width="1000" height="60" viewBox="0 0 1000 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-weight: 300;
        font-size: 11px;
        fill: #6e7681;
        text-anchor: middle;
        letter-spacing: 3px;
        opacity: 0;
        animation: fadeIn 1.2s ease 0.2s forwards;
      }

      .rule {
        stroke: #21262d;
        stroke-width: 0.8;
        stroke-dasharray: 80;
        stroke-dashoffset: 80;
        animation: draw 1.6s ease 0.1s forwards;
      }

      .dot {
        fill: #484f58;
        opacity: 0;
        animation: fadeIn 1s ease 0.4s forwards;
      }

      @keyframes fadeIn { to { opacity: 1; } }
      @keyframes draw  { to { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <rect width="1000" height="60" fill="#0a0c10"/>
  <line x1="460" y1="16" x2="540" y2="16" class="rule"/>
  <text x="500" y="40" class="text">ANUVAB DAS · KOLKATA, INDIA · ANVV.TECH</text>
  <circle cx="492" cy="52" r="1.2" class="dot"/>
  <circle cx="500" cy="52" r="1.2" class="dot"/>
  <circle cx="508" cy="52" r="1.2" class="dot"/>
</svg>
