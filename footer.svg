<svg width="1000" height="60" viewBox="0 0 1000 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #060709; }
      .rule {
        stroke: #21262d;
        stroke-width: 0.8;
      }
      .text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-weight: 300;
        font-size: 13px;
        fill: #8b949e;
        text-anchor: middle;
        letter-spacing: 2px;
      }
      .dot-red {
        fill: #ff3b30;
      }
    </style>
  </defs>

  <rect width="1000" height="60" class="bg"/>
  <line x1="460" y1="16" x2="540" y2="16" class="rule"/>
  <text x="500" y="42" class="text">Thank you<tspan class="dot-red">.</tspan></text>
</svg>
