<svg width="100%" viewBox="0 0 860 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .window-bg {
        fill: #030712;
        stroke: #1f2937;
        stroke-width: 1.2;
        rx: 8px;
        transition: all 0.3s ease;
      }
      .window-bg-hot {
        fill: #040d21;
        stroke: #3B82F6;
        stroke-width: 1.5;
        rx: 8px;
      }
      .window-header {
        fill: #0f172a;
        rx: 8px;
      }
      .window-header-hot {
        fill: #0d1e36;
        rx: 8px;
      }
      .window-title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        fill: #9ca3af;
        font-weight: bold;
      }
      .window-title-hot {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        fill: #60A5FA;
        font-weight: bold;
      }
      .btn-red { fill: #FF5F56; }
      .btn-yellow { fill: #FFBD2E; }
      .btn-green { fill: #27C93F; }
      
      .btn-dim { fill: #1f2937; }

      .p-tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8px;
        fill: #06B6D4;
        font-weight: bold;
        letter-spacing: 1px;
      }
      .p-title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        fill: #ffffff;
        font-weight: bold;
      }
      .p-sub {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8px;
        fill: #6b7280;
      }
      .p-desc {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8px;
        fill: #9ca3af;
      }
      .prompt {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8px;
        fill: #10B981;
        font-weight: bold;
      }
      .cmd {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8.5px;
        fill: #d1d5db;
      }
      
      /* Links and hover styles */
      .card-link {
        text-decoration: none;
        cursor: pointer;
      }
      .card-link:hover .window-bg {
        stroke: #3B82F6;
        fill: #040d21;
      }
      .card-link:hover .window-header {
        fill: #0d1e36;
      }
      .card-link:hover .window-title {
        fill: #60A5FA;
      }

      /* Animated indicator dots */
      .status-pulse-green {
        fill: #10B981;
        animation: pulseGreen 2s infinite;
      }
      @keyframes pulseGreen {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      .status-pulse-orange {
        fill: #F59E0B;
        animation: pulseOrange 2.5s infinite;
      }
      @keyframes pulseOrange {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }

      .status-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 7.5px;
        font-weight: bold;
      }

      /* Entrance Animation */
      .card-g {
        opacity: 0;
        transform: translateY(15px);
        animation: cardSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .cg-1 { animation-delay: 0.1s; }
      .cg-2 { animation-delay: 0.25s; }
      .cg-3 { animation-delay: 0.4s; }
      .cg-4 { animation-delay: 0.55s; }
      @keyframes cardSlideUp {
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>

  <!-- Section Title -->
  <text x="20" y="22" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#3B82F6" font-weight="bold" letter-spacing="3px">~/PROJECTS</text>
  <line x1="20" y1="30" x2="840" y2="30" stroke="#1f2937" stroke-width="1"/>

  <!-- ================= PROJECT 1: SMART HELMET SYSTEM ================= -->
  <a href="https://github.com/Stewy8506/Smart-Helmet-System" target="_blank" class="card-link">
    <g class="card-g cg-1" transform="translate(10, 42)">
      <rect width="200" height="268" class="window-bg-hot"/>
      <path d="M 0 8 A 8 8 0 0 1 8 0 L 192 0 A 8 8 0 0 1 200 8 L 200 24 L 0 24 Z" class="window-header-hot"/>
      
      <!-- OS Window Controls -->
      <circle cx="16" cy="12" r="4" class="btn-red"/>
      <circle cx="28" cy="12" r="4" class="btn-yellow"/>
      <circle cx="40" cy="12" r="4" class="btn-green"/>
      <text x="100" y="15" class="window-title-hot" text-anchor="middle">smart-helmet.elf</text>

      <!-- Terminal content -->
      <g transform="translate(15, 42)">
        <text x="0" y="10" class="p-tag">EMBEDDED / DSP</text>
        <text x="0" y="26" class="p-title">Smart Helmet</text>
        <text x="0" y="38" class="p-title">System</text>
        
        <line x1="0" y1="46" x2="170" y2="46" stroke="#1e293b" stroke-width="1"/>

        <!-- Logs / Diagnostics -->
        <text x="0" y="60" class="prompt">$</text>
        <text x="12" y="60" class="cmd">build --target=esp32</text>
        <text x="0" y="74" class="prompt">$</text>
        <text x="12" y="74" class="cmd">mcu_mix_engine_init()</text>
        <text x="0" y="88" class="prompt">$</text>
        <text x="12" y="88" class="cmd">yolov8_adas_run</text>

        <line x1="0" y1="98" x2="170" y2="98" stroke="#1e293b" stroke-width="1"/>

        <!-- Details -->
        <text x="0" y="112" class="p-desc">Multi-MCU distributed riding</text>
        <text x="0" y="124" class="p-desc">safety node. Integrates DSP</text>
        <text x="0" y="136" class="p-desc">audio mixing, ANC, and edge</text>
        <text x="0" y="148" class="p-desc">AI collision warnings.</text>
        
        <line x1="0" y1="160" x2="170" y2="160" stroke="#1e293b" stroke-width="1"/>

        <text x="0" y="174" class="p-sub">DSP: STM32F401 (DMA, I2S)</text>
        <text x="0" y="186" class="p-sub">SAFETY: ESP32-S3 (IMU Fusion)</text>
        <text x="0" y="198" class="p-sub">AI: YOLOv8 Computer Vision</text>

        <line x1="0" y1="208" x2="170" y2="208" stroke="#1e293b" stroke-width="1"/>

        <!-- Status -->
        <circle cx="6" cy="218" r="4.5" class="status-pulse-green"/>
        <text x="18" y="221" class="status-text" fill="#10B981">● ACTIVE DEV</text>
      </g>
    </g>
  </a>

  <!-- ================= PROJECT 2: AI WORKSPACE ================= -->
  <a href="https://github.com/Stewy8506/AI-App" target="_blank" class="card-link">
    <g class="card-g cg-2" transform="translate(222, 42)">
      <rect width="200" height="268" class="window-bg"/>
      <path d="M 0 8 A 8 8 0 0 1 8 0 L 192 0 A 8 8 0 0 1 200 8 L 200 24 L 0 24 Z" class="window-header"/>
      
      <!-- OS Window Controls -->
      <circle cx="16" cy="12" r="4" class="btn-red"/>
      <circle cx="28" cy="12" r="4" class="btn-yellow"/>
      <circle cx="40" cy="12" r="4" class="btn-green"/>
      <text x="100" y="15" class="window-title" text-anchor="middle">ai-workspace</text>

      <!-- Terminal content -->
      <g transform="translate(15, 42)">
        <text x="0" y="10" class="p-tag">FULL-STACK / AI</text>
        <text x="0" y="26" class="p-title">AI Workspace</text>
        <text x="0" y="38" class="p-title">(AI-App)</text>
        
        <line x1="0" y1="46" x2="170" y2="46" stroke="#1e293b" stroke-width="1"/>

        <text x="0" y="60" class="prompt">$</text>
        <text x="12" y="60" class="cmd">npm run dev</text>
        <text x="0" y="74" class="prompt">$</text>
        <text x="12" y="74" class="cmd">routing_engines_active</text>
        <text x="0" y="88" class="prompt">$</text>
        <text x="12" y="88" class="cmd">rag_local_vector_sync</text>

        <line x1="0" y1="98" x2="170" y2="98" stroke="#1e293b" stroke-width="1"/>

        <!-- Details -->
        <text x="0" y="112" class="p-desc">Self-hosted AI environment.</text>
        <text x="0" y="124" class="p-desc">Routes across 25+ LLMs,</text>
        <text x="0" y="136" class="p-desc">features local RAG, usage cost</text>
        <text x="0" y="148" class="p-desc">telemetry, and model arena.</text>
        
        <line x1="0" y1="160" x2="170" y2="160" stroke="#1e293b" stroke-width="1"/>

        <text x="0" y="174" class="p-sub">FRONT: Next.js, Zustand</text>
        <text x="0" y="186" class="p-sub">BACK: FastAPI, SQLite, Chroma</text>
        <text x="0" y="198" class="p-sub">TOOLS: Python Code Sandbox</text>

        <line x1="0" y1="208" x2="170" y2="208" stroke="#1e293b" stroke-width="1"/>

        <!-- Status -->
        <circle cx="6" cy="218" r="4.5" class="status-pulse-green"/>
        <text x="18" y="221" class="status-text" fill="#10B981">● ACTIVE DEV</text>
      </g>
    </g>
  </a>

  <!-- ================= PROJECT 3: DATAFLOW VISUALISER ================= -->
  <a href="https://github.com/Stewy8506/Repository-Visualiser" target="_blank" class="card-link">
    <g class="card-g cg-3" transform="translate(434, 42)">
      <rect width="200" height="268" class="window-bg"/>
      <path d="M 0 8 A 8 8 0 0 1 8 0 L 192 0 A 8 8 0 0 1 200 8 L 200 24 L 0 24 Z" class="window-header"/>
      
      <!-- OS Window Controls -->
      <circle cx="16" cy="12" r="4" class="btn-red"/>
      <circle cx="28" cy="12" r="4" class="btn-yellow"/>
      <circle cx="40" cy="12" r="4" class="btn-green"/>
      <text x="100" y="15" class="window-title" text-anchor="middle">dataflow-viz</text>

      <!-- Terminal content -->
      <g transform="translate(15, 42)">
        <text x="0" y="10" class="p-tag">DESKTOP / COMPILERS</text>
        <text x="0" y="26" class="p-title">Dataflow</text>
        <text x="0" y="38" class="p-title">Visualiser</text>
        
        <line x1="0" y1="46" x2="170" y2="46" stroke="#1e293b" stroke-width="1"/>

        <text x="0" y="60" class="prompt">$</text>
        <text x="12" y="60" class="cmd">cargo tauri dev</text>
        <text x="0" y="74" class="prompt">$</text>
        <text x="12" y="74" class="cmd">oxc_ast_index_running</text>
        <text x="0" y="88" class="prompt">$</text>
        <text x="12" y="88" class="cmd">simulate_blast_radius</text>

        <line x1="0" y1="98" x2="170" y2="98" stroke="#1e293b" stroke-width="1"/>

        <!-- Details -->
        <text x="0" y="112" class="p-desc">High-performance desktop tool</text>
        <text x="0" y="124" class="p-desc">to visualize dependency graphs</text>
        <text x="0" y="136" class="p-desc">and simulate refactor blast</text>
        <text x="0" y="148" class="p-desc">radii using local AST indexes.</text>
        
        <line x1="0" y1="160" x2="170" y2="160" stroke="#1e293b" stroke-width="1"/>

        <text x="0" y="174" class="p-sub">ENGINE: Rust, Tauri v2</text>
        <text x="0" y="186" class="p-sub">FRONT: React 19, TypeScript</text>
        <text x="0" y="198" class="p-sub">AST: oxc-parser (Rust-based)</text>

        <line x1="0" y1="208" x2="170" y2="208" stroke="#1e293b" stroke-width="1"/>

        <!-- Status -->
        <circle cx="6" cy="218" r="4.5" class="status-pulse-orange"/>
        <text x="18" y="221" class="status-text" fill="#F59E0B">● NEAR RELEASE</text>
      </g>
    </g>
  </a>

  <!-- ================= PROJECT 4: MOMENTUM TRACKER ================= -->
  <a href="https://github.com/Stewy8506/RN-Habit-Tracker" target="_blank" class="card-link">
    <g class="card-g cg-4" transform="translate(646, 42)">
      <rect width="200" height="268" class="window-bg"/>
      <path d="M 0 8 A 8 8 0 0 1 8 0 L 192 0 A 8 8 0 0 1 200 8 L 200 24 L 0 24 Z" class="window-header"/>
      
      <!-- OS Window Controls -->
      <circle cx="16" cy="12" r="4" class="btn-red"/>
      <circle cx="28" cy="12" r="4" class="btn-yellow"/>
      <circle cx="40" cy="12" r="4" class="btn-green"/>
      <text x="100" y="15" class="window-title" text-anchor="middle">momentum-app</text>

      <!-- Terminal content -->
      <g transform="translate(15, 42)">
        <text x="0" y="10" class="p-tag">MOBILE / STATE</text>
        <text x="0" y="26" class="p-title">Momentum</text>
        <text x="0" y="38" class="p-title">Tracker</text>
        
        <line x1="0" y1="46" x2="170" y2="46" stroke="#1e293b" stroke-width="1"/>

        <text x="0" y="60" class="prompt">$</text>
        <text x="12" y="60" class="cmd">npx expo start</text>
        <text x="0" y="74" class="prompt">$</text>
        <text x="12" y="74" class="cmd">dnd_lock_controller_init</text>
        <text x="0" y="88" class="prompt">$</text>
        <text x="12" y="88" class="cmd">sync_firebase_snap_lobby</text>

        <line x1="0" y1="98" x2="170" y2="98" stroke="#1e293b" stroke-width="1"/>

        <!-- Details -->
        <text x="0" y="112" class="p-desc">Neumorphic productivity app</text>
        <text x="0" y="124" class="p-desc">with custom DND modules,</text>
        <text x="0" y="136" class="p-desc">focus timers, habit heatmaps</text>
        <text x="0" y="148" class="p-desc">and live social lobbies.</text>
        
        <line x1="0" y1="160" x2="170" y2="160" stroke="#1e293b" stroke-width="1"/>

        <text x="0" y="174" class="p-sub">MOBILE: React Native (v0.81)</text>
        <text x="0" y="186" class="p-sub">ROUTER: Expo Router v6</text>
        <text x="0" y="198" class="p-sub">STATE: Zustand, Firebase Auth</text>

        <line x1="0" y1="208" x2="170" y2="208" stroke="#1e293b" stroke-width="1"/>

        <!-- Status -->
        <circle cx="6" cy="218" r="4.5" class="status-pulse-green"/>
        <text x="18" y="221" class="status-text" fill="#10B981">● ACTIVE DEV</text>
      </g>
    </g>
  </a>

</svg>
