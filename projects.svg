<svg width="100%" viewBox="0 0 860 360" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');

    .term-title  { font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; fill:#ffffff; }
    .term-label  { font-family:'JetBrains Mono',monospace; font-size:8px;  fill:#3B82F6; letter-spacing:2px; }
    .term-stack  { font-family:'JetBrains Mono',monospace; font-size:8px;  fill:#6b7280; }
    .term-desc   { font-family:'JetBrains Mono',monospace; font-size:7.5px; fill:#4b5563; }
    .term-tag    { font-family:'JetBrains Mono',monospace; font-size:7px;  fill:#1e3a5f; letter-spacing:1.5px; }
    .prompt      { font-family:'JetBrains Mono',monospace; font-size:8px;  fill:#22c55e; }
    .num         { font-family:'JetBrains Mono',monospace; font-size:8px;  fill:#1e3a5f; letter-spacing:2px; }

    /* Card styles */
    .card-bg     { fill:#04080f; stroke:#1e3a5f; stroke-width:0.7; }
    .card-hot    { fill:#040c16; stroke:#3B82F6; stroke-width:0.9; }
    .title-bar   { fill:#080e1a; }
    .title-bar-h { fill:#071428; }
    .sep         { stroke:#1e3a5f; stroke-width:0.5; }

    /* Window dots */
    .dot-r { fill:#3b1e1e; }
    .dot-y { fill:#2a2a1a; }
    .dot-g { fill:#1a2e1a; }
    .dot-ra { fill:#ef4444; animation: winBlink 4s ease-in-out infinite; }
    .dot-ya { fill:#eab308; animation: winBlink 4s ease-in-out infinite 0.3s; }
    .dot-ga { fill:#22c55e; animation: winBlink 4s ease-in-out infinite 0.6s; }
    @keyframes winBlink { 0%,80%,100%{opacity:1} 85%{opacity:0.4} }

    /* Status pulse */
    .status-live {
      fill: #22c55e;
      animation: livePulse 1.8s ease-in-out infinite;
    }
    .status-build {
      fill: #eab308;
      animation: livePulse 2.4s ease-in-out infinite 0.6s;
    }
    .status-done  { fill: #3B82F6; }
    @keyframes livePulse { 0%,100%{r:3;opacity:1} 50%{r:5;opacity:0.3} }

    /* Slide-up fade in for cards */
    .c1 { animation: slideUp 0.5s cubic-bezier(0.2,0,0.2,1) both; animation-delay:0.0s; }
    .c2 { animation: slideUp 0.5s cubic-bezier(0.2,0,0.2,1) both; animation-delay:0.15s; }
    .c3 { animation: slideUp 0.5s cubic-bezier(0.2,0,0.2,1) both; animation-delay:0.30s; }
    .c4 { animation: slideUp 0.5s cubic-bezier(0.2,0,0.2,1) both; animation-delay:0.45s; }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* Animated circuit trace */
    .trace-anim {
      stroke:#3B82F6; stroke-width:0.6; fill:none;
      stroke-dasharray:4 5;
      animation: traceDash 2s linear infinite;
    }
    @keyframes traceDash { to { stroke-dashoffset:-36; } }

    /* Progress bar */
    .bar-bg { fill:#0d1520; }
    .bar-on { fill:#1e3a5f; }
    .bar-hi { fill:#3B82F6; animation: barGrow 0.9s cubic-bezier(0.4,0,0.2,1) both; }
    .b1 { animation-delay:0.8s; }
    .b2 { animation-delay:0.95s; }
    .b3 { animation-delay:1.1s; }
    .b4 { animation-delay:1.25s; }
    @keyframes barGrow { from { transform:scaleX(0); transform-origin:left; } to { transform:scaleX(1); transform-origin:left; } }

    .trace { stroke:#1e3a5f; stroke-width:0.5; fill:none; }
  </style>
  <filter id="cardGlow">
    <feGaussianBlur stdDeviation="1.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="pgBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#020608"/>
    <stop offset="100%" stop-color="#060a10"/>
  </linearGradient>
</defs>

<rect width="860" height="360" fill="url(#pgBg)"/>

<!-- Section header -->
<text x="20" y="22" font-family="JetBrains Mono,monospace" font-size="9" fill="#3B82F6" letter-spacing="3">~/PROJECTS</text>
<line x1="20" y1="30" x2="840" y2="30" class="trace"/>
<text x="840" y="22" font-family="JetBrains Mono,monospace" font-size="8" fill="#1e3a5f" text-anchor="end">10+ SHIPPED</text>

<!-- ═══════════════ CARD 1 — Smart Helmet ═══════════════ -->
<g class="c1">
  <!-- Card shell -->
  <rect x="12" y="40" width="202" height="290" rx="5" class="card-hot" filter="url(#cardGlow)"/>
  <!-- Title bar -->
  <rect x="12" y="40" width="202" height="26" rx="5" class="title-bar-h"/>
  <rect x="12" y="55" width="202" height="11" class="title-bar-h"/>
  <!-- Window controls -->
  <circle cx="26" cy="53" r="4" class="dot-ra"/>
  <circle cx="38" cy="53" r="4" class="dot-ya"/>
  <circle cx="50" cy="53" r="4" class="dot-ga"/>
  <text x="114" y="57" class="num" text-anchor="middle">01_HARDWARE.cpp</text>
  <line x1="12" y1="66" x2="214" y2="66" class="sep"/>
  <!-- Status -->
  <circle cx="200" cy="53" r="4" class="status-live"/>
  <!-- Content -->
  <text x="22" y="86" class="term-label">SMART HELMET</text>
  <text x="22" y="100" class="term-title">Rider Safety</text>
  <text x="22" y="112" class="term-title">System</text>
  <line x1="22" y1="120" x2="202" y2="120" class="sep"/>
  <!-- Prompt-style stack -->
  <text x="22" y="136" class="prompt">$</text>
  <text x="32" y="136" class="term-stack">ESP32  C++  KiCad</text>
  <text x="22" y="150" class="prompt">$</text>
  <text x="32" y="150" class="term-stack">FreeRTOS  BLE  MQTT</text>
  <line x1="22" y1="160" x2="202" y2="160" class="sep"/>
  <!-- Description -->
  <text x="22" y="176" class="term-desc">Bluetooth audio &amp; noise</text>
  <text x="22" y="189" class="term-desc">cancellation for motorcycle</text>
  <text x="22" y="202" class="term-desc">riders. Custom PCB design.</text>
  <!-- Animated trace -->
  <polyline points="22,222 58,222 58,232 120,232" class="trace-anim"/>
  <circle cx="22"  cy="222" r="2" fill="#1e3a5f"/>
  <circle cx="120" cy="232" r="2.5" fill="#3B82F6" filter="url(#cardGlow)"/>
  <!-- Tags -->
  <text x="22" y="270" class="term-tag">⬡  EMBEDDED  ·  IOT  ·  PCB</text>
  <!-- Bottom border line -->
  <line x1="22" y1="278" x2="202" y2="278" class="sep"/>
  <text x="22" y="292" class="term-tag" style="fill:#22c55e">● LIVE PROJECT</text>
</g>

<!-- ═══════════════ CARD 2 — Helmet Companion App ═══════════════ -->
<g class="c2">
  <rect x="226" y="40" width="202" height="290" rx="5" class="card-bg"/>
  <rect x="226" y="40" width="202" height="26" rx="5" class="title-bar"/>
  <rect x="226" y="55" width="202" height="11" class="title-bar"/>
  <circle cx="240" cy="53" r="4" class="dot-r"/>
  <circle cx="252" cy="53" r="4" class="dot-y"/>
  <circle cx="264" cy="53" r="4" class="dot-g"/>
  <text x="328" y="57" class="num" text-anchor="middle">02_MOBILE.dart</text>
  <line x1="226" y1="66" x2="428" y2="66" class="sep"/>
  <circle cx="414" cy="53" r="4" class="status-live" style="animation-delay:0.7s"/>
  <!-- Content -->
  <text x="236" y="86" class="term-label">COMPANION APP</text>
  <text x="236" y="100" class="term-title">Helmet Control</text>
  <text x="236" y="112" class="term-title">&amp; Monitor</text>
  <line x1="236" y1="120" x2="416" y2="120" class="sep"/>
  <text x="236" y="136" class="prompt">$</text>
  <text x="246" y="136" class="term-stack">Flutter  Dart  BLE</text>
  <text x="236" y="150" class="prompt">$</text>
  <text x="246" y="150" class="term-stack">Firebase  Charts</text>
  <line x1="236" y1="160" x2="416" y2="160" class="sep"/>
  <text x="236" y="176" class="term-desc">Real-time data viz,</text>
  <text x="236" y="189" class="term-desc">wireless helmet control</text>
  <text x="236" y="202" class="term-desc">&amp; live sensor monitoring.</text>
  <polyline points="236,222 272,222 272,232 334,232" class="trace-anim" style="animation-delay:-1s"/>
  <circle cx="236" cy="222" r="2" fill="#1e3a5f"/>
  <circle cx="334" cy="232" r="2.5" fill="#3B82F6" filter="url(#cardGlow)"/>
  <text x="236" y="270" class="term-tag">⬡  FLUTTER  ·  MOBILE  ·  BLE</text>
  <line x1="236" y1="278" x2="416" y2="278" class="sep"/>
  <text x="236" y="292" class="term-tag" style="fill:#22c55e">● LIVE PROJECT</text>
</g>

<!-- ═══════════════ CARD 3 — AI Health Assistant ═══════════════ -->
<g class="c3">
  <rect x="440" y="40" width="202" height="290" rx="5" class="card-bg"/>
  <rect x="440" y="40" width="202" height="26" rx="5" class="title-bar"/>
  <rect x="440" y="55" width="202" height="11" class="title-bar"/>
  <circle cx="454" cy="53" r="4" class="dot-r"/>
  <circle cx="466" cy="53" r="4" class="dot-y"/>
  <circle cx="478" cy="53" r="4" class="dot-g"/>
  <text x="542" y="57" class="num" text-anchor="middle">03_AI_ML.py</text>
  <line x1="440" y1="66" x2="642" y2="66" class="sep"/>
  <circle cx="628" cy="53" r="4" class="status-build" style="animation-delay:1.4s"/>
  <!-- Content -->
  <text x="450" y="86" class="term-label">AI HEALTH  SYS</text>
  <text x="450" y="100" class="term-title">Health Insights</text>
  <text x="450" y="112" class="term-title">Engine</text>
  <line x1="450" y1="120" x2="630" y2="120" class="sep"/>
  <text x="450" y="136" class="prompt">$</text>
  <text x="460" y="136" class="term-stack">Python  TensorFlow</text>
  <text x="450" y="150" class="prompt">$</text>
  <text x="460" y="150" class="term-stack">Firebase  GCP</text>
  <line x1="450" y1="160" x2="630" y2="160" class="sep"/>
  <text x="450" y="176" class="term-desc">ML-driven health predictions,</text>
  <text x="450" y="189" class="term-desc">anomaly detection &amp; smart</text>
  <text x="450" y="202" class="term-desc">health monitoring insights.</text>
  <polyline points="450,222 486,222 486,232 548,232" class="trace-anim" style="animation-delay:-0.5s"/>
  <circle cx="450" cy="222" r="2" fill="#1e3a5f"/>
  <circle cx="548" cy="232" r="2.5" fill="#3B82F6" filter="url(#cardGlow)"/>
  <text x="450" y="270" class="term-tag">⬡  AI  ·  ML  ·  HEALTH  ·  GCP</text>
  <line x1="450" y1="278" x2="630" y2="278" class="sep"/>
  <text x="450" y="292" class="term-tag" style="fill:#eab308">◑ IN PROGRESS</text>
</g>

<!-- ═══════════════ CARD 4 — Energy Dashboard ═══════════════ -->
<g class="c4">
  <rect x="654" y="40" width="202" height="290" rx="5" class="card-bg"/>
  <rect x="654" y="40" width="202" height="26" rx="5" class="title-bar"/>
  <rect x="654" y="55" width="202" height="11" class="title-bar"/>
  <circle cx="668" cy="53" r="4" class="dot-r"/>
  <circle cx="680" cy="53" r="4" class="dot-y"/>
  <circle cx="692" cy="53" r="4" class="dot-g"/>
  <text x="756" y="57" class="num" text-anchor="middle">04_WEB.tsx</text>
  <line x1="654" y1="66" x2="856" y2="66" class="sep"/>
  <circle cx="842" cy="53" r="4" class="status-done"/>
  <!-- Content -->
  <text x="664" y="86" class="term-label">ENERGY DASH</text>
  <text x="664" y="100" class="term-title">Real-Time Energy</text>
  <text x="664" y="112" class="term-title">Platform</text>
  <line x1="664" y1="120" x2="844" y2="120" class="sep"/>
  <text x="664" y="136" class="prompt">$</text>
  <text x="674" y="136" class="term-stack">React  Node.js</text>
  <text x="664" y="150" class="prompt">$</text>
  <text x="674" y="150" class="term-stack">GCP  SQL  D3.js</text>
  <line x1="664" y1="160" x2="844" y2="160" class="sep"/>
  <text x="664" y="176" class="term-desc">Real-time energy monitor,</text>
  <text x="664" y="189" class="term-desc">analytics &amp; optimization</text>
  <text x="664" y="202" class="term-desc">across IoT-connected nodes.</text>
  <polyline points="664,222 700,222 700,232 762,232" class="trace-anim" style="animation-delay:-1.5s"/>
  <circle cx="664" cy="222" r="2" fill="#1e3a5f"/>
  <circle cx="762" cy="232" r="2.5" fill="#3B82F6" filter="url(#cardGlow)"/>
  <text x="664" y="270" class="term-tag">⬡  REACT  ·  CLOUD  ·  DATA</text>
  <line x1="664" y1="278" x2="844" y2="278" class="sep"/>
  <text x="664" y="292" class="term-tag" style="fill:#3B82F6">✦ SHIPPED</text>
</g>

<!-- Bottom label -->
<text x="430" y="346" font-family="JetBrains Mono,monospace" font-size="8" fill="#1e3a5f" text-anchor="middle" letter-spacing="2">HARDWARE  ·  MOBILE  ·  AI  ·  WEB  //  MORE AT github.com/Stewy8506</text>
</svg>
