<svg width="1000" height="16" viewBox="0 0 1000 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .rule {
        stroke: #21262d;
        stroke-width: 0.8;
        stroke-linecap: round;
        stroke-dasharray: 140;
        stroke-dashoffset: 140;
        animation: draw 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes draw { to { stroke-dashoffset: 0; } }
    </style>
  </defs>
  <line x1="430" y1="8" x2="570" y2="8" class="rule"/>
</svg>
