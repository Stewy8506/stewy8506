<svg width="100%" viewBox="0 0 860 180" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
    .sl{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#9ca3af}
    .sh{font-family:'JetBrains Mono',monospace;font-size:8px;fill:#3B82F6;letter-spacing:1px}
    .pill{fill:#080d14;stroke:#1e3a5f;stroke-width:0.5;rx:3}
    .pill-hot{fill:#080d14;stroke:#3B82F6;stroke-width:0.8;rx:3}
    .dot-s{fill:#3B82F6}
    .dot-d{fill:#1e3a5f}
    .p1{animation:pi 0.4s ease forwards;opacity:0}
    .p2{animation:pi 0.4s ease forwards;opacity:0;animation-delay:0.05s}
    .p3{animation:pi 0.4s ease forwards;opacity:0;animation-delay:0.1s}
