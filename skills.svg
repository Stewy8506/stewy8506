<svg width="100%" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .window-bg {
        fill: #030712;
        stroke: #1f2937;
        stroke-width: 1.5;
        rx: 10px;
      }
      .window-header {
        fill: #0f172a;
        rx: 10px;
      }
      .window-title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        fill: #9ca3af;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      
      /* Network Nodes */
      .core-node {
        fill: #1e3a5f;
        stroke: #3B82F6;
        stroke-width: 2;
      }
      .skill-node {
        fill: #0d1527;
        stroke: #1e3a5f;
        stroke-width: 1;
        rx: 5px;
      }
      .skill-node-hot {
        fill: #091d34;
        stroke: #3B82F6;
        stroke-width: 1.5;
        rx: 5px;
      }
      .node-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9.5px;
        fill: #e5e7eb;
        font-weight: 700;
      }
      .node-text-hot {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9.5px;
        fill: #60A5FA;
        font-weight: 700;
      }
      .group-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        fill: #06B6D4;
        font-weight: bold;
        letter-spacing: 1.5px;
      }

      /* Connection Lines */
      .conn-line {
        stroke: #1e293b;
        stroke-width: 1;
        fill: none;
      }
      .conn-line-active {
        stroke: #3B82F6;
        stroke-width: 1.2;
        fill: none;
        stroke-dasharray: 5 5;
        animation: flow 2s linear infinite;
      }
      @keyframes flow {
        to { stroke-dashoffset: -20; }
      }

      .btn-red { fill: #FF5F56; }
      .btn-yellow { fill: #FFBD2E; }
      .btn-green { fill: #27C93F; }

      /* Pulse animation */
      .pulse-ring {
        stroke: #3B82F6;
        stroke-width: 1;
        fill: none;
        animation: pulse 3s cubic-bezier(0.215, 0.610, 0.355, 1) infinite;
      }
      @keyframes pulse {
        0% { r: 10; opacity: 1; }
        100% { r: 30; opacity: 0; }
      }
    </style>

    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- macOS Window Box -->
  <rect x="5" y="5" width="850" height="290" rx="10" fill="#000" opacity="0.3"/>
  <rect x="10" y="10" width="840" height="280" class="window-bg"/>
  <path d="M 10 20 A 10 10 0 0 1 20 10 L 840 10 A 10 10 0 0 1 850 20 L 850 42 L 10 42 Z" class="window-header"/>

  <!-- Window Dots -->
  <circle cx="28" cy="26" r="6" class="btn-red"/>
  <circle cx="48" cy="26" r="6" class="btn-yellow"/>
  <circle cx="68" cy="26" r="6" class="btn-green"/>

  <text x="430" y="30" class="window-title" text-anchor="middle">anuvab@macbook-pro-m3: ~/skills/schematic</text>

  <!-- Grid Background -->
  <g opacity="0.15">
    <line x1="50" y1="42" x2="50" y2="290" stroke="#1f2937"/>
    <line x1="150" y1="42" x2="150" y2="290" stroke="#1f2937"/>
    <line x1="250" y1="42" x2="250" y2="290" stroke="#1f2937"/>
    <line x1="350" y1="42" x2="350" y2="290" stroke="#1f2937"/>
    <line x1="450" y1="42" x2="450" y2="290" stroke="#1f2937"/>
    <line x1="550" y1="42" x2="550" y2="290" stroke="#1f2937"/>
    <line x1="650" y1="42" x2="650" y2="290" stroke="#1f2937"/>
    <line x1="750" y1="42" x2="750" y2="290" stroke="#1f2937"/>
  </g>

  <!-- ================= CONNECTION PATHS ================= -->
  <!-- Center to Clusters -->
  <path d="M 430 160 L 220 105" class="conn-line-active"/>
  <path d="M 430 160 L 640 105" class="conn-line-active"/>
  <path d="M 430 160 L 240 215" class="conn-line-active"/>
  <path d="M 430 160 L 620 215" class="conn-line-active"/>

  <!-- Cluster 1 (Embedded) internal links -->
  <line x1="220" y1="105" x2="120" y2="75" class="conn-line"/>
  <line x1="220" y1="105" x2="130" y2="135" class="conn-line"/>
  <line x1="220" y1="105" x2="310" y2="75" class="conn-line"/>
  <line x1="220" y1="105" x2="310" y2="135" class="conn-line"/>

  <!-- Cluster 2 (Systems) internal links -->
  <line x1="640" y1="105" x2="550" y2="75" class="conn-line"/>
  <line x1="640" y1="105" x2="550" y2="135" class="conn-line"/>
  <line x1="640" y1="105" x2="740" y2="75" class="conn-line"/>
  <line x1="640" y1="105" x2="730" y2="135" class="conn-line"/>

  <!-- Cluster 3 (Full-Stack/AI) internal links -->
  <line x1="240" y1="215" x2="140" y2="185" class="conn-line"/>
  <line x1="240" y1="215" x2="150" y2="245" class="conn-line"/>
  <line x1="240" y1="215" x2="330" y2="185" class="conn-line"/>
  <line x1="240" y1="215" x2="320" y2="245" class="conn-line"/>

  <!-- Cluster 4 (Mobile/State) internal links -->
  <line x1="620" y1="215" x2="530" y2="185" class="conn-line"/>
  <line x1="620" y1="215" x2="520" y2="245" class="conn-line"/>
  <line x1="620" y1="215" x2="710" y2="185" class="conn-line"/>
  <line x1="620" y1="215" x2="720" y2="245" class="conn-line"/>

  <!-- ================= CORE NODE ================= -->
  <circle cx="430" cy="160" r="16" class="pulse-ring"/>
  <circle cx="430" cy="160" r="10" fill="url(#coreGrad)"/>
  <text x="430" y="163" font-family="'JetBrains Mono', monospace" font-size="8" fill="#ffffff" font-weight="bold" text-anchor="middle">CORE</text>

  <!-- ================= CLUSTER 1: EMBEDDED & ROBOTICS ================= -->
  <text x="220" y="109" class="node-text-hot" text-anchor="middle">EMBEDDED</text>
  
  <!-- ESP32 -->
  <g transform="translate(80, 63)">
    <rect width="60" height="20" class="skill-node-hot"/>
    <text x="30" y="13" class="node-text-hot" text-anchor="middle">ESP32</text>
  </g>
  <!-- FreeRTOS -->
  <g transform="translate(85, 125)">
    <rect width="75" height="20" class="skill-node"/>
    <text x="37.5" y="13" class="node-text" text-anchor="middle">FreeRTOS</text>
  </g>
  <!-- STM32 HAL -->
  <g transform="translate(270, 63)">
    <rect width="70" height="20" class="skill-node-hot"/>
    <text x="35" y="13" class="node-text-hot" text-anchor="middle">STM32 HAL</text>
  </g>
  <!-- ROS -->
  <g transform="translate(275, 125)">
    <rect width="55" height="20" class="skill-node"/>
    <text x="27.5" y="13" class="node-text" text-anchor="middle">ROS</text>
  </g>

  <!-- ================= CLUSTER 2: SYSTEMS & COMPILATION ================= -->
  <text x="640" y="109" class="node-text-hot" text-anchor="middle">SYSTEMS</text>

  <!-- Rust -->
  <g transform="translate(510, 63)">
    <rect width="55" height="20" class="skill-node-hot"/>
    <text x="27.5" y="13" class="node-text-hot" text-anchor="middle">Rust</text>
  </g>
  <!-- Tauri v2 -->
  <g transform="translate(505, 125)">
    <rect width="70" height="20" class="skill-node"/>
    <text x="35" y="13" class="node-text" text-anchor="middle">Tauri v2</text>
  </g>
  <!-- AST Parsing -->
  <g transform="translate(705, 63)">
    <rect width="78" height="20" class="skill-node-hot"/>
    <text x="39" y="13" class="node-text-hot" text-anchor="middle">AST Parsing</text>
  </g>
  <!-- C/C++ -->
  <g transform="translate(700, 125)">
    <rect width="55" height="20" class="skill-node"/>
    <text x="27.5" y="13" class="node-text" text-anchor="middle">C/C++</text>
  </g>

  <!-- ================= CLUSTER 3: FULL-STACK & AI ================= -->
  <text x="240" y="219" class="node-text-hot" text-anchor="middle">WEB / AI</text>

  <!-- Next.js -->
  <g transform="translate(100, 175)">
    <rect width="65" height="20" class="skill-node-hot"/>
    <text x="32.5" y="13" class="node-text-hot" text-anchor="middle">Next.js</text>
  </g>
  <!-- FastAPI -->
  <g transform="translate(105, 235)">
    <rect width="65" height="20" class="skill-node"/>
    <text x="32.5" y="13" class="node-text" text-anchor="middle">FastAPI</text>
  </g>
  <!-- LLM & RAG -->
  <g transform="translate(290, 175)">
    <rect width="70" height="20" class="skill-node-hot"/>
    <text x="35" y="13" class="node-text-hot" text-anchor="middle">LLM / RAG</text>
  </g>
  <!-- Python -->
  <g transform="translate(285, 235)">
    <rect width="60" height="20" class="skill-node"/>
    <text x="30" y="13" class="node-text" text-anchor="middle">Python</text>
  </g>

  <!-- ================= CLUSTER 4: MOBILE & STATE ================= -->
  <text x="620" y="219" class="node-text-hot" text-anchor="middle">MOBILE</text>

  <!-- React Native -->
  <g transform="translate(485, 175)">
    <rect width="85" height="20" class="skill-node-hot"/>
    <text x="42.5" y="13" class="node-text-hot" text-anchor="middle">React Native</text>
  </g>
  <!-- Expo v54 -->
  <g transform="translate(475, 235)">
    <rect width="75" height="20" class="skill-node"/>
    <text x="37.5" y="13" class="node-text" text-anchor="middle">Expo v54</text>
  </g>
  <!-- Zustand -->
  <g transform="translate(670, 175)">
    <rect width="65" height="20" class="skill-node-hot"/>
    <text x="32.5" y="13" class="node-text-hot" text-anchor="middle">Zustand</text>
  </g>
  <!-- Firebase -->
  <g transform="translate(680, 235)">
    <rect width="65" height="20" class="skill-node"/>
    <text x="32.5" y="13" class="node-text" text-anchor="middle">Firebase</text>
  </g>

</svg>
