<g class="p10"><rect x="316" y="74" width="100" height="20" rx="3" class="pill"/><circle cx="326" cy="84" r="2.5" class="dot-d"/><text x="333" y="88" class="sl">React Native</text></g>
<g class="p11"><rect x="424" y="74" width="62" height="20" rx="3" class="pill"/><circle cx="434" cy="84" r="2.5" class="dot-d"/><text x="441" y="88" class="sl">Figma</text></g>
<g class="p12"><rect x="494" y="74" width="54" height="20" rx="3" class="pill"/><circle cx="504" cy="84" r="2.5" class="dot-d"/><text x="511" y="88" class="sl">CSS3</text></g>

