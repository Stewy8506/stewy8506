<svg width="100%" viewBox="0 0 860 220" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');

    .sl { font-family:'JetBrains Mono',monospace; font-size:9.5px; fill:#d1d5db; letter-spacing:0.5px; }
    .sh { font-family:'JetBrains Mono',monospace; font-size:8px; fill:#60A5FA; letter-spacing:3px; }
    .cat-label { font-family:'JetBrains Mono',monospace; font-size:9px; fill:#3B82F6; letter-spacing:2px; }

    /* Hex cell base */
    .hex { fill:#06101a; stroke:#1e3a5f; stroke-width:0.8; }
    .hex-active { fill:#060f1e; stroke:#3B82F6; stroke-width:1.2; }
    .hex-dim { fill:#04080f; stroke:#0d1f3c; stroke-width:0.5; }

    /* Dot indicators */
    .dot-on { fill:#3B82F6; }
    .dot-off { fill:#1e3a5f; }
    .dot-glow {
      fill:#60A5FA;
      filter: url(#hexGlow);
      animation: dotPulse 2.5s ease-in-out infinite;
    }
    @keyframes dotPulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

    /* Staggered pop-in */
    .h1  { animation: pop 0.35s ease forwards; opacity:0; animation-delay:0.00s; }
    .h2  { animation: pop 0.35s ease forwards; opacity:0; animation-delay:0.06s; }
    .h3  { animation: pop 0.35s ease forwards; opacity:0; animation-delay:0.12s; }
    .h4  { animation: pop 0.35s ease forwards; opacity:0; animation-delay:0.18s; }
    .h5  { animation: pop 0.35s ease forwards; opacity:0; animation-delay:0.24s; }
    .h6  { animation: pop 0.35s ease forwards; opacity:0; animation-delay:0.30s; }
    .h7  { animation: pop 0.35s ease forwards; opacity:0; animation-delay:0.36s; }
    .h8  { animation: pop 0.35s ease forwards; opacity:0; animation-delay:0.42s; }
    .h9  { animation: pop 0.35s ease forwards; opacity:0; animation-delay:0.48s; }
    .h10 { animation: pop 0.35s ease forwards; opacity:0; animation-delay:0.54s; }
    .h11 { animation: pop 0.35s ease forwards; opacity:0; animation-delay:0.60s; }
    .h12 { animation: pop 0.35s ease forwards; opacity:0; animation-delay:0.66s; }
    .h13 { animation: pop 0.35s ease forwards; opacity:0; animation-delay:0.72s; }
    .h14 { animation: pop 0.35s ease forwards; opacity:0; animation-delay:0.78s; }
    .h15 { animation: pop 0.35s ease forwards; opacity:0; animation-delay:0.84s; }
    .h16 { animation: pop 0.35s ease forwards; opacity:0; animation-delay:0.90s; }
    .h17 { animation: pop 0.35s ease forwards; opacity:0; animation-delay:0.96s; }
    .h18 { animation: pop 0.35s ease forwards; opacity:0; animation-delay:1.02s; }
    .h19 { animation: pop 0.35s ease forwards; opacity:0; animation-delay:1.08s; }
    .h20 { animation: pop 0.35s ease forwards; opacity:0; animation-delay:1.14s; }
    .h21 { animation: pop 0.35s ease forwards; opacity:0; animation-delay:1.20s; }
    .h22 { animation: pop 0.35s ease forwards; opacity:0; animation-delay:1.26s; }
    .h23 { animation: pop 0.35s ease forwards; opacity:0; animation-delay:1.32s; }
    .h24 { animation: pop 0.35s ease forwards; opacity:0; animation-delay:1.38s; }
    .h25 { animation: pop 0.35s ease forwards; opacity:0; animation-delay:1.44s; }
    .h26 { animation: pop 0.35s ease forwards; opacity:0; animation-delay:1.50s; }
    .h27 { animation: pop 0.35s ease forwards; opacity:0; animation-delay:1.56s; }
    .h28 { animation: pop 0.35s ease forwards; opacity:0; animation-delay:1.62s; }
    @keyframes pop {
      from { opacity:0; transform: scale(0.6); }
      to   { opacity:1; transform: scale(1); }
    }

    .trace { stroke:#1e3a5f; stroke-width:0.5; fill:none; }
  </style>
  <filter id="hexGlow">
    <feGaussianBlur stdDeviation="2" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="hgBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#020608"/>
    <stop offset="100%" stop-color="#060a10"/>
  </linearGradient>
</defs>

<rect width="860" height="220" fill="url(#hgBg)"/>

<!-- Section header -->
<text x="20" y="22" class="sh">~/TECH  STACK</text>
<line x1="20" y1="30" x2="840" y2="30" class="trace"/>

