<!-- Right-side meta labels -->
<text x="840" y="54" font-family="JetBrains Mono,monospace" font-size="8" fill="#1e3a5f" text-anchor="end">6 TOOLS</text>
<text x="840" y="88" font-family="JetBrains Mono,monospace" font-size="8" fill="#1e3a5f" text-anchor="end">CROSS-PLATFORM</text>
