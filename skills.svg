    .p8{animation:pi 0.4s ease forwards;opacity:0;animation-delay:0.35s}
    .p9{animation:pi 0.4s ease forwards;opacity:0;animation-delay:0.4s}
    .p10{animation:pi 0.4s ease forwards;opacity:0;animation-delay:0.45s}
    .p11{animation:pi 0.4s ease forwards;opacity:0;animation-delay:0.5s}
    .p12{animation:pi 0.4s ease forwards;opacity:0;animation-delay:0.55s}
    .p13{animation:pi 0.4s ease forwards;opacity:0;animation-delay:0.6s}
