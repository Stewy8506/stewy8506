<svg width="100%" viewBox="0 0 860 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .stack-title {
        font-family: 'Outfit', sans-serif;
        font-size: 11.5px;
        font-weight: 800;
        letter-spacing: 2px;
        fill: #ffffff;
      }
      .txt-mono {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8.5px;
        fill: #9ca3af;
      }
      .txt-percent {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8px;
        font-weight: bold;
      }
      
      /* Glass Panel Column */
      .glass-col {
        fill: #ffffff;
        fill-opacity: 0.02;
        stroke: #ffffff;
        stroke-opacity: 0.06;
        stroke-width: 1;
        rx: 14px;
        transition: all 0.3s ease;
      }
      .glass-col-header {
        fill: #ffffff;
        fill-opacity: 0.02;
        stroke: #ffffff;
        stroke-opacity: 0.04;
        stroke-width: 1;
        rx: 8px;
      }

      /* Progress Bar Tracks */
      .progress-track {
        fill: #1e293b;
        fill-opacity: 0.4;
        rx: 3px;
      }
      .progress-fill-green { fill: #10B981; filter: url(#glowGreen); }
      .progress-fill-red { fill: #EF4444; filter: url(#glowRed); }
      .progress-fill-blue { fill: #3B82F6; filter: url(#glowBlue); }
      .progress-fill-purple { fill: #8B5CF6; filter: url(#glowPurple); }

      /* Animation for progress loading */
      .bar-load {
        transform-origin: left;
        animation: barGrow 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }
      @keyframes barGrow {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }

      /* Staggered Column Entrance - Nested to prevent transform conflicts */
      .col-group {
        opacity: 0;
        animation: colSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .col-1 { animation-delay: 0.05s; }
      .col-2 { animation-delay: 0.15s; }
      .col-3 { animation-delay: 0.25s; }
      .col-4 { animation-delay: 0.35s; }
      @keyframes colSlideUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Ambient Backglows */
      .bg-glow {
        filter: url(#heavyGlow);
        opacity: 0.1;
      }
    </style>

    <!-- Filters for neon glows -->
    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <linearGradient id="colBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="860" height="280" fill="#020205"/>

  <!-- Background Glowing Orbs -->
  <circle cx="150" cy="140" r="80" class="bg-glow" fill="#10B981"/>
  <circle cx="360" cy="140" r="80" class="bg-glow" fill="#EF4444"/>
  <circle cx="570" cy="140" r="80" class="bg-glow" fill="#3B82F6"/>
  <circle cx="710" cy="140" r="80" class="bg-glow" fill="#8B5CF6"/>

  <text x="20" y="22" font-family="'Outfit', sans-serif" font-size="10" fill="#3B82F6" font-weight="bold" letter-spacing="3px">~/SKILLS</text>
  <line x1="20" y1="30" x2="840" y2="30" stroke="#1f2937" stroke-width="0.8"/>

  <!-- ================= COLUMN 1: EMBEDDED (Green) ================= -->
  <g transform="translate(20, 42)">
    <g class="col-group col-1">
      <rect width="195" height="215" class="glass-col" fill="url(#colBg)"/>
      <rect x="10" y="10" width="175" height="28" class="glass-col-header"/>
      <circle cx="24" cy="24" r="4" fill="#10B981"/>
      <text x="36" y="28" class="stack-title">EMBEDDED</text>

      <!-- Skills List -->
      <g transform="translate(15, 50)">
        <!-- Skill 1 -->
        <text x="0" y="20" class="txt-mono">ESP32-S3 / ESP32</text>
        <rect x="0" y="26" width="135" height="6" class="progress-track"/>
        <rect x="0" y="26" width="121" height="6" class="progress-fill-green bar-load"/>
        <text x="145" y="32" class="txt-percent" fill="#10B981">90%</text>

        <!-- Skill 2 -->
        <text x="0" y="55" class="txt-mono">STM32 HAL / DSP</text>
        <rect x="0" y="61" width="135" height="6" class="progress-track"/>
        <rect x="0" y="61" width="114" height="6" class="progress-fill-green bar-load"/>
        <text x="145" y="67" class="txt-percent" fill="#10B981">85%</text>

        <!-- Skill 3 -->
        <text x="0" y="90" class="txt-mono">FreeRTOS Scheduling</text>
        <rect x="0" y="96" width="135" height="6" class="progress-track"/>
        <rect x="0" y="96" width="101" height="6" class="progress-fill-green bar-load"/>
        <text x="145" y="102" class="txt-percent" fill="#10B981">75%</text>

        <!-- Skill 4 -->
        <text x="0" y="125" class="txt-mono">ROS / Sensor Fusion</text>
        <rect x="0" y="131" width="135" height="6" class="progress-track"/>
        <rect x="0" y="131" width="94" height="6" class="progress-fill-green bar-load"/>
        <text x="145" y="137" class="txt-percent" fill="#10B981">70%</text>
      </g>
    </g>
  </g>

  <!-- ================= COLUMN 2: SYSTEMS & RUST (Red) ================= -->
  <g transform="translate(225, 42)">
    <g class="col-group col-2">
      <rect width="195" height="215" class="glass-col" fill="url(#colBg)"/>
      <rect x="10" y="10" width="175" height="28" class="glass-col-header"/>
      <circle cx="24" cy="24" r="4" fill="#EF4444"/>
      <text x="36" y="28" class="stack-title">SYSTEMS</text>

      <!-- Skills List -->
      <g transform="translate(15, 50)">
        <!-- Skill 1 -->
        <text x="0" y="20" class="txt-mono">Rust System Dev</text>
        <rect x="0" y="26" width="135" height="6" class="progress-track"/>
        <rect x="0" y="26" width="108" height="6" class="progress-fill-red bar-load"/>
        <text x="145" y="32" class="txt-percent" fill="#EF4444">80%</text>

        <!-- Skill 2 -->
        <text x="0" y="55" class="txt-mono">Tauri v2 Desktop</text>
        <rect x="0" y="61" width="135" height="6" class="progress-track"/>
        <rect x="0" y="61" width="101" height="6" class="progress-fill-red bar-load"/>
        <text x="145" y="67" class="txt-percent" fill="#EF4444">75%</text>

        <!-- Skill 3 -->
        <text x="0" y="90" class="txt-mono">AST Node Parsing</text>
        <rect x="0" y="96" width="135" height="6" class="progress-track"/>
        <rect x="0" y="96" width="108" height="6" class="progress-fill-red bar-load"/>
        <text x="145" y="102" class="txt-percent" fill="#EF4444">80%</text>

        <!-- Skill 4 -->
        <text x="0" y="125" class="txt-mono">C/C++ Embed / Comp</text>
        <rect x="0" y="131" width="135" height="6" class="progress-track"/>
        <rect x="0" y="131" width="114" height="6" class="progress-fill-red bar-load"/>
        <text x="145" y="137" class="txt-percent" fill="#EF4444">85%</text>
      </g>
    </g>
  </g>

  <!-- ================= COLUMN 3: WEB / FULL-STACK (Blue) ================= -->
  <g transform="translate(430, 42)">
    <g class="col-group col-3">
      <rect width="195" height="215" class="glass-col" fill="url(#colBg)"/>
      <rect x="10" y="10" width="175" height="28" class="glass-col-header"/>
      <circle cx="24" cy="24" r="4" fill="#3B82F6"/>
      <text x="36" y="28" class="stack-title">FULL-STACK</text>

      <!-- Skills List -->
      <g transform="translate(15, 50)">
        <!-- Skill 1 -->
        <text x="0" y="20" class="txt-mono">React 19 / Next.js</text>
        <rect x="0" y="26" width="135" height="6" class="progress-track"/>
        <rect x="0" y="26" width="114" height="6" class="progress-fill-blue bar-load"/>
        <text x="145" y="32" class="txt-percent" fill="#3B82F6">85%</text>

        <!-- Skill 2 -->
        <text x="0" y="55" class="txt-mono">FastAPI API Engine</text>
        <rect x="0" y="61" width="135" height="6" class="progress-track"/>
        <rect x="0" y="61" width="108" height="6" class="progress-fill-blue bar-load"/>
        <text x="145" y="67" class="txt-percent" fill="#3B82F6">80%</text>

        <!-- Skill 3 -->
        <text x="0" y="90" class="txt-mono">Node.js / Express</text>
        <rect x="0" y="96" width="135" height="6" class="progress-track"/>
        <rect x="0" y="96" width="101" height="6" class="progress-fill-blue bar-load"/>
        <text x="145" y="102" class="txt-percent" fill="#3B82F6">75%</text>

        <!-- Skill 4 -->
        <text x="0" y="125" class="txt-mono">ChromaDB / SQLite</text>
        <rect x="0" y="131" width="135" height="6" class="progress-track"/>
        <rect x="0" y="131" width="94" height="6" class="progress-fill-blue bar-load"/>
        <text x="145" y="137" class="txt-percent" fill="#3B82F6">70%</text>
      </g>
    </g>
  </g>

  <!-- ================= COLUMN 4: MOBILE & AI (Purple) ================= -->
  <g transform="translate(635, 42)">
    <g class="col-group col-4">
      <rect width="195" height="215" class="glass-col" fill="url(#colBg)"/>
      <rect x="10" y="10" width="175" height="28" class="glass-col-header"/>
      <circle cx="24" cy="24" r="4" fill="#8B5CF6"/>
      <text x="36" y="28" class="stack-title">MOBILE / AI</text>

      <!-- Skills List -->
      <g transform="translate(15, 50)">
        <!-- Skill 1 -->
        <text x="0" y="20" class="txt-mono">React Native / Expo</text>
        <rect x="0" y="26" width="135" height="6" class="progress-track"/>
        <rect x="0" y="26" width="108" height="6" class="progress-fill-purple bar-load"/>
        <text x="145" y="32" class="txt-percent" fill="#8B5CF6">80%</text>

        <!-- Skill 2 -->
        <text x="0" y="55" class="txt-mono">Zustand State Engine</text>
        <rect x="0" y="61" width="135" height="6" class="progress-track"/>
        <rect x="0" y="61" width="114" height="6" class="progress-fill-purple bar-load"/>
        <text x="145" y="67" class="txt-percent" fill="#8B5CF6">85%</text>

        <!-- Skill 3 -->
        <text x="0" y="90" class="txt-mono">Gemini API / RAG</text>
        <rect x="0" y="96" width="135" height="6" class="progress-track"/>
        <rect x="0" y="96" width="108" height="6" class="progress-fill-purple bar-load"/>
        <text x="145" y="102" class="txt-percent" fill="#8B5CF6">80%</text>

        <!-- Skill 4 -->
        <text x="0" y="125" class="txt-mono">Firebase / Firestore</text>
        <rect x="0" y="131" width="135" height="6" class="progress-track"/>
        <rect x="0" y="131" width="108" height="6" class="progress-fill-purple bar-load"/>
        <text x="145" y="137" class="txt-percent" fill="#8B5CF6">80%</text>
      </g>
    </g>
  </g>

</svg>
