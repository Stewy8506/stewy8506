    .p16{animation:pi 0.4s ease forwards;opacity:0;animation-delay:0.75s}
    .p17{animation:pi 0.4s ease forwards;opacity:0;animation-delay:0.8s}
    .p18{animation:pi 0.4s ease forwards;opacity:0;animation-delay:0.85s}
    .p19{animation:pi 0.4s ease forwards;opacity:0;animation-delay:0.9s}
    .p20{animation:pi 0.4s ease forwards;opacity:0;animation-delay:0.95s}
    .p21{animation:pi 0.4s ease forwards;opacity:0;animation-delay:1.0s}
    .p22{animation:pi 0.4s ease forwards;opacity:0;animation-delay:1.05s}
    .p23{animation:pi 0.4s ease forwards;opacity:0;animation-delay:1.1s}
    .p24{animation:pi 0.4s ease forwards;opacity:0;animation-delay:1.15s}
    @keyframes pi{from{opacity:0;transform:scale(0.7)}to{opacity:1;transform:scale(1)}}
