<g class="p20"><rect x="142" y="142" width="40" height="20" rx="3" class="pill"/><circle cx="152" cy="152" r="2.5" class="dot-d"/><text x="159" y="156" class="sl">C++</text></g>
<g class="p21"><rect x="190" y="142" width="66" height="20" rx="3" class="pill"/><circle cx="200" cy="152" r="2.5" class="dot-d"/><text x="207" y="156" class="sl">Python</text></g>
<g class="p22"><rect x="264" y="142" width="46" height="20" rx="3" class="pill"/><circle cx="274" cy="152" r="2.5" class="dot-d"/><text x="281" y="156" class="sl">Java</text></g>
<g class="p23"><rect x="318" y="142" width="46" height="20" rx="3" class="pill"/><circle cx="328" cy="152" r="2.5" class="dot-d"/><text x="335" y="156" class="sl">Dart</text></g>
<g class="p24"><rect x="372" y="142" width="66" height="20" rx="3" class="pill"/><circle cx="382" cy="152" r="2.5" class="dot-d"/><text x="389" y="156" class="sl">YAML</text></g>

<!-- right side decoration -->
<text x="840" y="52" font-family="JetBrains Mono,monospace" font-size="8" fill="#1e3a5f" text-anchor="end">24 TOOLS</text>
<text x="840" y="88" font-family="JetBrains Mono,monospace" font-size="8" fill="#1e3a5f" text-anchor="end">CROSS-PLATFORM</text>
<text x="840" y="122" font-family="JetBrains Mono,monospace" font-size="8" fill="#1e3a5f" text-anchor="end">CLOUD-NATIVE</text>
<text x="840" y="156" font-family="JetBrains Mono,monospace" font-size="8" fill="#1e3a5f" text-anchor="end">POLYGLOT</text>

