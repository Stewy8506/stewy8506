<svg width="100%" viewBox="0 0 860 40" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&amp;display=swap');
    .tk {
      font-family:'JetBrains Mono',monospace;
      font-size:10px;
      font-weight:700;
      letter-spacing:1.5px;
    }
    .scroll { animation: sc 20s linear infinite; }
    @keyframes sc { from { transform:translateX(0); } to { transform:translateX(-50%); } }
  </style>
  <linearGradient id="tickerGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#1e3a5f"/>
    <stop offset="25%"  stop-color="#3B82F6"/>
    <stop offset="50%"  stop-color="#60A5FA"/>
    <stop offset="75%"  stop-color="#3B82F6"/>
    <stop offset="100%" stop-color="#1e3a5f"/>
  </linearGradient>
  <clipPath id="tc"><rect width="860" height="40"/></clipPath>
</defs>
<rect width="860" height="40" fill="#020608"/>
<line x1="0" y1="0"  x2="860" y2="0"  stroke="#1e3a5f" stroke-width="0.8"/>
<line x1="0" y1="39" x2="860" y2="39" stroke="#1e3a5f" stroke-width="0.8"/>
<!-- Left fade -->
<rect x="0" y="0" width="60" height="40" fill="url(#leftFade)"/>
<rect x="800" y="0" width="60" height="40" fill="url(#rightFade)"/>
<defs>
  <linearGradient id="leftFade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#020608" stop-opacity="1"/>
    <stop offset="100%" stop-color="#020608" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="rightFade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#020608" stop-opacity="0"/>
    <stop offset="100%" stop-color="#020608" stop-opacity="1"/>
  </linearGradient>
</defs>
<g clip-path="url(#tc)">
  <g class="scroll">
    <text y="25" class="tk" fill="url(#tickerGrad)">·  ANUVAB DAS  ·  IoT ENGINEER  ·  ROBOTICS  ·  FULL-STACK  ·  KOLKATA, INDIA  ·  ESP32  ·  ROS  ·  FLUTTER  ·  REACT  ·  PCB DESIGN  ·  OPEN TO COLLABS  ·  BUILDING REAL THINGS  ·  ANUVAB DAS  ·  IoT ENGINEER  ·  ROBOTICS  ·  FULL-STACK  ·  KOLKATA, INDIA  ·  ESP32  ·  ROS  ·  FLUTTER  ·  REACT  ·  PCB DESIGN  ·  OPEN TO COLLABS  ·  BUILDING REAL THINGS  ·</text>
  </g>
</g>
</svg>
