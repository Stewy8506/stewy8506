<svg width="100%" viewBox="0 0 860 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&amp;display=swap');
      
      .glass-bar {
        fill: #ffffff;
        fill-opacity: 0.02;
        stroke: #ffffff;
        stroke-opacity: 0.06;
        stroke-width: 1;
        rx: 8px;
      }
      .tk-hdr {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8.5px;
        font-weight: 700;
        fill: #06B6D4;
        letter-spacing: 1.5px;
      }
      .tk-txt {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 1.5px;
      }
      .scroll-container {
        animation: tickerScroll 24s linear infinite;
      }
      @keyframes tickerScroll {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }
      
      /* Gradients and masks */
      .fade-left { fill: url(#leftGrad); }
      .fade-right { fill: url(#rightGrad); }
    </style>
    
    <linearGradient id="tickerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="25%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="75%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <clipPath id="tickerClip"><rect x="150" y="2" width="690" height="36"/></clipPath>
    
    <linearGradient id="leftGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#020205" stop-opacity="1"/>
      <stop offset="100%" stop-color="#020205" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#020205" stop-opacity="0"/>
      <stop offset="100%" stop-color="#020205" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Glass bar -->
  <rect x="5" y="2" width="850" height="36" class="glass-bar"/>

  <!-- Static header widget -->
  <text x="25" y="23" class="tk-hdr">TELEMETRY_FEED &gt;</text>
  
  <g clip-path="url(#tickerClip)">
    <g class="scroll-container">
      <text x="150" y="23" class="tk-txt" fill="url(#tickerGrad)">·  ANUVAB DAS  ·  IoT &amp; ROBOTICS ENGINEER  ·  FULL-STACK DEVELOPER  ·  PCB DESIGN  ·  ESP32-S3  ·  STM32 HAL  ·  RUST  ·  TAURI  ·  REACT NATIVE  ·  NEXT.JS  ·  YOLOv8  ·  FREE_RTOS  ·  ZUSTAND  ·  ANUVAB DAS  ·  IoT &amp; ROBOTICS ENGINEER  ·  FULL-STACK DEVELOPER  ·  PCB DESIGN  ·  ESP32-S3  ·  STM32 HAL  ·  RUST  ·  TAURI  ·  REACT NATIVE  ·  NEXT.JS  ·  YOLOv8  ·  FREE_RTOS  ·  ZUSTAND  ·</text>
    </g>
    
    <!-- Fades on the edges of the text display area -->
    <rect x="150" y="2" width="40" height="36" class="fade-left"/>
    <rect x="800" y="2" width="46" height="36" class="fade-right"/>
  </g>
</svg>
