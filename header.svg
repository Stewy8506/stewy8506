<svg width="100%" viewBox="0 0 860 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=JetBrains+Mono:wght@400;700&display=swap');
      
      .hud-title {
        font-family: 'Outfit', sans-serif;
        font-size: 64px;
        font-weight: 900;
        fill: #ffffff;
        letter-spacing: -2px;
      }
      .hud-subtitle {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        fill: #06B6D4;
        letter-spacing: 5px;
      }
      .txt-mono {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        fill: #9ca3af;
      }
      .txt-highlight {
        fill: #60A5FA;
        font-weight: bold;
      }
      .txt-neon {
        fill: #a78bfa;
        font-weight: bold;
      }
      .txt-green {
        fill: #10B981;
        font-weight: bold;
      }
      
      /* Glassmorphism Panel styles */
      .glass-panel {
        fill: #ffffff;
        fill-opacity: 0.02;
        stroke: #ffffff;
        stroke-opacity: 0.08;
        stroke-width: 1;
        rx: 16px;
      }
      .glass-panel-hot {
        fill: #ffffff;
        fill-opacity: 0.04;
        stroke: #3B82F6;
        stroke-opacity: 0.25;
        stroke-width: 1.2;
        rx: 16px;
      }
      
      /* Breathing Neon Circles in Background */
      .bg-glow-purple {
        fill: #8B5CF6;
        filter: url(#heavyGlow);
        opacity: 0.18;
        animation: breathPurple 8s ease-in-out infinite;
      }
      .bg-glow-blue {
        fill: #3B82F6;
        filter: url(#heavyGlow);
        opacity: 0.18;
        animation: breathBlue 8s ease-in-out infinite 4s;
      }
      
      @keyframes breathPurple {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.12; }
        50% { transform: scale(1.2) translate(-20px, 10px); opacity: 0.22; }
      }
      @keyframes breathBlue {
        0%, 100% { transform: scale(1.2) translate(0, 0); opacity: 0.12; }
        50% { transform: scale(1) translate(20px, -10px); opacity: 0.22; }
      }

      /* Dial Rotation and Progress */
      .dial-track {
        stroke: #1e293b;
        stroke-width: 3.5;
        fill: none;
      }
      .dial-fill {
        stroke: #3B82F6;
        stroke-width: 3.5;
        fill: none;
        stroke-dasharray: 220;
        stroke-dashoffset: 65;
        transform: rotate(-90deg);
        transform-origin: 100px 140px;
        animation: dialDraw 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .dial-fill-purple {
        stroke: #8B5CF6;
        stroke-width: 3.5;
        fill: none;
        stroke-dasharray: 220;
        stroke-dashoffset: 90;
        transform: rotate(-90deg);
        transform-origin: 760px 140px;
        animation: dialDrawPurple 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes dialDraw {
        from { stroke-dashoffset: 220; }
        to { stroke-dashoffset: 65; }
      }
      @keyframes dialDrawPurple {
        from { stroke-dashoffset: 220; }
        to { stroke-dashoffset: 90; }
      }

      /* Soft overlay scanning light */
      .scanline {
        fill: none;
        stroke: #ffffff;
        stroke-width: 0.5;
        opacity: 0.05;
        animation: scan 4s linear infinite;
      }
      @keyframes scan {
        0% { transform: translateY(-40px); }
        100% { transform: translateY(280px); }
      }
    ]]></style>

    <!-- Filters for frosted glass & heavy ambient backlights -->
    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>
  </defs>

  <!-- Pitch Dark Background -->
  <rect width="860" height="240" fill="#020205"/>

  <!-- Ambient Glow Backdrops -->
  <circle cx="200" cy="120" r="100" class="bg-glow-purple"/>
  <circle cx="660" cy="120" r="110" class="bg-glow-blue"/>

  <!-- Grid overlay (sleek cyberpunk dashboard lines) -->
  <g opacity="0.08">
    <line x1="0" y1="40" x2="860" y2="40" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="0" y1="80" x2="860" y2="80" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="0" y1="120" x2="860" y2="120" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="0" y1="160" x2="860" y2="160" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="0" y1="200" x2="860" y2="200" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="100" y1="0" x2="100" y2="240" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="200" y1="0" x2="200" y2="240" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="300" y1="0" x2="300" y2="240" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="400" y1="0" x2="400" y2="240" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="500" y1="0" x2="500" y2="240" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="600" y1="0" x2="600" y2="240" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="700" y1="0" x2="700" y2="240" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="800" y1="0" x2="800" y2="240" stroke="#ffffff" stroke-width="0.8"/>
  </g>

  <!-- Scanning Line -->
  <line x1="0" y1="0" x2="860" y2="0" class="scanline"/>

  <!-- ================= LEFT DIAL GAUGE ================= -->
  <g transform="translate(0, 0)">
    <rect x="25" y="25" width="150" height="190" class="glass-panel"/>
    <circle cx="100" cy="100" r="35" class="dial-track"/>
    <circle cx="100" cy="100" r="35" class="dial-fill"/>
    <text x="100" y="103" font-family="'Outfit', sans-serif" font-size="14" fill="#ffffff" font-weight="900" text-anchor="middle">92%</text>
    <text x="100" y="115" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#3B82F6" text-anchor="middle">SYS.LOAD</text>
    
    <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#ffffff" font-weight="bold" text-anchor="middle">EMBEDDED</text>
    <text x="100" y="174" font-family="'JetBrains Mono', monospace" font-size="8" fill="#9ca3af" text-anchor="middle">Active Nodes: 04</text>
    <text x="100" y="186" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10B981" text-anchor="middle">STATUS: STABLE</text>
  </g>

  <!-- ================= MIDDLE MAIN HEADER CARD ================= -->
  <g transform="translate(0, 0)">
    <rect x="190" y="25" width="480" height="190" class="glass-panel-hot" fill="url(#glassGrad)"/>
    
    <!-- Title and Subtitle -->
    <text x="430" y="112" class="hud-title" text-anchor="middle" fill="url(#textGrad)" filter="url(#textGlow)">ANUVAB DAS</text>
    <text x="430" y="145" class="hud-subtitle" text-anchor="middle">CREATIVE CODE &amp; CIRCUITS</text>

    <!-- Visual status indicators inside the glass panel -->
    <g transform="translate(255, 172)">
      <circle cx="10" cy="5" r="3" class="txt-green"/>
      <text x="20" y="8" class="txt-mono" font-size="8">ESP32</text>
      
      <circle cx="80" cy="5" r="3" class="txt-highlight"/>
      <text x="90" y="8" class="txt-mono" font-size="8">Rust</text>
      
      <circle cx="140" cy="5" r="3" class="txt-neon"/>
      <text x="150" y="8" class="txt-mono" font-size="8">React Native</text>

      <circle cx="240" cy="5" r="3" fill="#06B6D4"/>
      <text x="250" y="8" class="txt-mono" font-size="8">Next-Gen AI</text>
    </g>
  </g>

  <!-- ================= RIGHT DIAL GAUGE ================= -->
  <g transform="translate(0, 0)">
    <rect x="685" y="25" width="150" height="190" class="glass-panel"/>
    <circle cx="760" cy="100" r="35" class="dial-track"/>
    <circle cx="760" cy="100" r="35" class="dial-fill-purple"/>
    <text x="760" y="103" font-family="'Outfit', sans-serif" font-size="14" fill="#ffffff" font-weight="900" text-anchor="middle">80%</text>
    <text x="760" y="115" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#8B5CF6" text-anchor="middle">CORE.ENG</text>

    <text x="760" y="160" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#ffffff" font-weight="bold" text-anchor="middle">SOFTWARE</text>
    <text x="760" y="174" font-family="'JetBrains Mono', monospace" font-size="8" fill="#9ca3af" text-anchor="middle">Modules: 12</text>
    <text x="760" y="186" font-family="'JetBrains Mono', monospace" font-size="8" fill="#a78bfa" text-anchor="middle">STAGE: PROD</text>
  </g>

</svg>
