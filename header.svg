<svg width="100%" viewBox="0 0 860 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=JetBrains+Mono:wght@400;700&display=swap');
      
      .window-bg {
        fill: #030712;
        fill-opacity: 0.85;
        stroke: #1f2937;
        stroke-opacity: 0.6;
        stroke-width: 1.2;
        rx: 16px;
      }
      .window-header {
        fill: #0f172a;
        fill-opacity: 0.9;
        rx: 16px;
      }
      .window-title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        fill: #9ca3af;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      
      .hud-title {
        font-family: 'Outfit', sans-serif;
        font-size: 56px;
        font-weight: 900;
        fill: url(#textGrad);
        letter-spacing: -1.5px;
      }
      .hud-subtitle {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        fill: #06B6D4;
        letter-spacing: 4px;
      }
      .txt-mono {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        fill: #9ca3af;
      }
      .txt-green {
        fill: #10B981;
        font-weight: bold;
      }
      .txt-blue {
        fill: #3B82F6;
        font-weight: bold;
      }
      
      /* Breathing Neon Circles in Background */
      .bg-glow-purple {
        fill: #8B5CF6;
        filter: url(#heavyGlow);
        opacity: 0.12;
        animation: breathPurple 8s ease-in-out infinite;
      }
      .bg-glow-blue {
        fill: #3B82F6;
        filter: url(#heavyGlow);
        opacity: 0.12;
        animation: breathBlue 8s ease-in-out infinite 4s;
      }
      
      @keyframes breathPurple {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.1; }
        50% { transform: scale(1.15) translate(-15px, 5px); opacity: 0.18; }
      }
      @keyframes breathBlue {
        0%, 100% { transform: scale(1.15) translate(0, 0); opacity: 0.1; }
        50% { transform: scale(1) translate(15px, -5px); opacity: 0.18; }
      }

      /* Dial Rotation & Progress - Fixed Y coordinates & transform origins */
      .dial-track {
        stroke: #1e293b;
        stroke-width: 3.5;
        fill: none;
      }
      .dial-fill {
        stroke: #3B82F6;
        stroke-width: 3.5;
        fill: none;
        stroke-dasharray: 188;
        stroke-dashoffset: 56;
        transform: rotate(-90deg);
        transform-origin: 100px 165px;
        animation: dialDraw 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .dial-fill-purple {
        stroke: #8B5CF6;
        stroke-width: 3.5;
        fill: none;
        stroke-dasharray: 188;
        stroke-dashoffset: 75;
        transform: rotate(-90deg);
        transform-origin: 760px 165px;
        animation: dialDrawPurple 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes dialDraw {
        from { stroke-dashoffset: 188; }
        to { stroke-dashoffset: 56; }
      }
      @keyframes dialDrawPurple {
        from { stroke-dashoffset: 188; }
        to { stroke-dashoffset: 75; }
      }

      /* Portfolo Link Button style */
      .pf-btn {
        transition: all 0.3s ease;
      }
      .pf-btn:hover {
        fill: #1e293b;
        stroke: #06B6D4;
        filter: drop-shadow(0 0 4px rgba(6, 182, 212, 0.4));
      }
      
      .btn-red { fill: #FF5F56; }
      .btn-yellow { fill: #FFBD2E; }
      .btn-green { fill: #27C93F; }
    ]]></style>

    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" />
    </filter>

    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="35%" stop-color="#8B5CF6"/>
      <stop offset="70%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Pitch Dark Background -->
  <rect width="860" height="250" fill="#020205"/>

  <!-- Ambient Glow Backdrops -->
  <circle cx="250" cy="125" r="90" class="bg-glow-purple"/>
  <circle cx="610" cy="125" r="100" class="bg-glow-blue"/>

  <!-- macOS Window Box (Unified Dashboard Panel) -->
  <rect x="10" y="10" width="840" height="230" class="window-bg"/>
  <path d="M 10 26 A 16 16 0 0 1 26 10 L 834 10 A 16 16 0 0 1 850 26 L 850 44 L 10 44 Z" class="window-header"/>

  <!-- Window Dots -->
  <circle cx="30" cy="27" r="5.5" class="btn-red"/>
  <circle cx="48" cy="27" r="5.5" class="btn-yellow"/>
  <circle cx="68" cy="27" r="5.5" class="btn-green"/>

  <text x="430" y="31" class="window-title" text-anchor="middle">anuvab@macbook-pro-m3: ~/portfolio-terminal</text>

  <!-- ================= PORTFOLIO BUTTON LINK ================= -->
  <a href="https://anvv.tech" target="_blank" style="cursor: pointer;">
    <g class="pf-btn">
      <rect x="715" y="55" width="115" height="26" rx="6" fill="#0f172a" fill-opacity="0.7" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1"/>
      <text x="772" y="71" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#60A5FA" font-weight="bold" text-anchor="middle">anvv.tech ↗</text>
    </g>
  </a>

  <!-- ================= LEFT DIAL GAUGE (Embedded Status) ================= -->
  <g>
    <!-- Dial Track and Fill -->
    <circle cx="100" cy="165" r="30" class="dial-track"/>
    <circle cx="100" cy="165" r="30" class="dial-fill"/>
    
    <!-- Percent Text -->
    <text x="100" y="168" font-family="'Outfit', sans-serif" font-size="12" fill="#ffffff" font-weight="900" text-anchor="middle">92%</text>
    
    <!-- Label -->
    <text x="100" y="212" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981" font-weight="bold" text-anchor="middle">EMBEDDED</text>
    <circle cx="100" cy="115" r="3" fill="#10B981"/>
    <line x1="100" y1="118" x2="100" y2="128" stroke="#1f2937" stroke-width="1"/>
  </g>

  <!-- ================= CENTER NAME & DETAILS ================= -->
  <g>
    <!-- Mini Portfolio Tag -->
    <text x="430" y="80" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#9ca3af" font-weight="bold" letter-spacing="3px" text-anchor="middle">SYSTEM STATUS: ACTIVE</text>
    
    <!-- Title -->
    <text x="430" y="132" class="hud-title" text-anchor="middle">ANUVAB DAS</text>
    
    <!-- Subtitle -->
    <text x="430" y="158" class="hud-subtitle" text-anchor="middle">CREATIVE CODE &amp; CIRCUITS</text>

    <!-- Visual status indicators inside the center area -->
    <g transform="translate(255, 178)">
      <circle cx="10" cy="5" r="3.5" fill="#10B981"/>
      <text x="20" y="8.5" class="txt-mono">ESP32</text>
      
      <circle cx="80" cy="5" r="3.5" fill="#3B82F6"/>
      <text x="90" y="8.5" class="txt-mono">Rust</text>
      
      <circle cx="140" cy="5" r="3.5" fill="#8B5CF6"/>
      <text x="150" y="8.5" class="txt-mono">React Native</text>

      <circle cx="240" cy="5" r="3.5" fill="#06B6D4"/>
      <text x="250" y="8.5" class="txt-mono">Next-Gen AI</text>
    </g>
  </g>

  <!-- ================= RIGHT DIAL GAUGE (Software Status) ================= -->
  <g>
    <!-- Dial Track and Fill -->
    <circle cx="760" cy="165" r="30" class="dial-track"/>
    <circle cx="760" cy="165" r="30" class="dial-fill-purple"/>
    
    <!-- Percent Text -->
    <text x="760" y="168" font-family="'Outfit', sans-serif" font-size="12" fill="#ffffff" font-weight="900" text-anchor="middle">80%</text>

    <!-- Label -->
    <text x="760" y="212" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8B5CF6" font-weight="bold" text-anchor="middle">SOFTWARE</text>
    <circle cx="760" cy="115" r="3" fill="#8B5CF6"/>
    <line x1="760" y1="118" x2="760" y2="128" stroke="#1f2937" stroke-width="1"/>
  </g>

</svg>
