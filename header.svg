<svg width="100%" viewBox="0 0 860 200" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
    .name{font-family:'Syne',sans-serif;font-size:64px;font-weight:800;fill:#ffffff;letter-spacing:-2px}
    .sub{font-family:'JetBrains Mono',monospace;font-size:11px;fill:#3B82F6;letter-spacing:2px}
    .dim{fill:#1a2744;stroke:none}
    .grid-line{stroke:#0f1f3d;stroke-width:0.5}
    .circuit{stroke:#1e3a5f;stroke-width:1;fill:none}
    .circuit-hot{stroke:#3B82F6;stroke-width:1;fill:none}
    .node{fill:#3B82F6}
    .node-dim{fill:#1e3a5f}
    .dash-anim{stroke:#3B82F6;stroke-width:1;fill:none;stroke-dasharray:4 4;animation:dash 1.5s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-16}}
    .glow-anim{animation:glow 3s ease-in-out infinite}
    @keyframes glow{0%,100%{opacity:0.4}50%{opacity:1}}
    .scan{animation:scan 4s ease-in-out infinite}
    @keyframes scan{0%,100%{opacity:0}40%,60%{opacity:1}}
  </style>
</defs>
<rect width="860" height="200" fill="#060a10"/>
<!-- grid -->
<line x1="0" y1="40" x2="860" y2="40" class="grid-line"/>
<line x1="0" y1="80" x2="860" y2="80" class="grid-line"/>
<line x1="0" y1="120" x2="860" y2="120" class="grid-line"/>
<line x1="0" y1="160" x2="860" y2="160" class="grid-line"/>
<line x1="100" y1="0" x2="100" y2="200" class="grid-line"/>
<line x1="200" y1="0" x2="200" y2="200" class="grid-line"/>
<line x1="300" y1="0" x2="300" y2="200" class="grid-line"/>
<line x1="400" y1="0" x2="400" y2="200" class="grid-line"/>
<line x1="500" y1="0" x2="500" y2="200" class="grid-line"/>
<line x1="600" y1="0" x2="600" y2="200" class="grid-line"/>
<line x1="700" y1="0" x2="700" y2="200" class="grid-line"/>
<line x1="800" y1="0" x2="800" y2="200" class="grid-line"/>
<!-- circuit traces left side -->
<polyline points="0,60 40,60 40,100 80,100" class="circuit"/>
<polyline points="0,140 30,140 30,100 80,100" class="circuit"/>
<polyline points="80,100 100,100" class="circuit-hot"/>
<circle cx="80" cy="100" r="3" class="node-dim"/>
<circle cx="100" cy="100" r="3" class="node"/>
<!-- animated trace right to left -->
<polyline points="860,60 820,60 820,100 780,100" class="circuit"/>
<polyline points="860,140 830,140 830,100 780,100" class="circuit"/>
<polyline points="780,100 760,100" class="circuit-hot"/>
<circle cx="780" cy="100" r="3" class="node-dim"/>
<circle cx="760" cy="100" r="3" class="node"/>
<!-- top circuit traces -->
<polyline points="200,0 200,20 240,20 240,40" class="circuit"/>
<polyline points="600,0 600,20 560,20 560,40" class="circuit"/>
<circle cx="240" cy="40" r="2.5" class="node"/>
<circle cx="560" cy="40" r="2.5" class="node"/>
<!-- animated dashes -->
<line x1="100" y1="100" x2="200" y2="100" class="dash-anim"/>
<line x1="660" y1="100" x2="760" y2="100" class="dash-anim" style="animation-delay:-0.8s"/>
<!-- scan line -->
<rect x="0" y="95" width="860" height="1" fill="#3B82F6" opacity="0.15" class="scan"/>
<!-- bottom bar -->
<rect x="0" y="185" width="860" height="15" fill="#060a10"/>
<line x1="0" y1="185" x2="860" y2="185" stroke="#1e3a5f" stroke-width="0.5"/>
<!-- corner brackets -->
<polyline points="20,10 10,10 10,25" stroke="#3B82F6" stroke-width="1.5" fill="none"/>
<polyline points="840,10 850,10 850,25" stroke="#3B82F6" stroke-width="1.5" fill="none"/>
<polyline points="20,190 10,190 10,175" stroke="#3B82F6" stroke-width="1.5" fill="none"/>
<polyline points="840,190 850,190 850,175" stroke="#3B82F6" stroke-width="1.5" fill="none"/>
<!-- name -->
<text x="430" y="118" class="name" text-anchor="middle">ANUVAB DAS</text>
<!-- sub -->
<text x="430" y="145" class="sub" text-anchor="middle">IoT  ·  ROBOTICS  ·  FULL-STACK</text>
<!-- top label -->
<text x="430" y="28" font-family="JetBrains Mono,monospace" font-size="9" fill="#1e3a5f" text-anchor="middle" letter-spacing="3">SYSTEM ONLINE // v2.0 // KOLKATA, IN</text>
<!-- node dots scattered -->
<circle cx="200" cy="100" r="2" class="node-dim"/>
<circle cx="300" cy="40" r="2" class="node-dim"/>
<circle cx="300" cy="160" r="2" class="node-dim"/>
<circle cx="500" cy="40" r="2" class="node-dim"/>
<circle cx="500" cy="160" r="2" class="node-dim"/>
<circle cx="660" cy="100" r="2" class="node-dim"/>
<circle cx="400" cy="40" r="2.5" fill="#1e3a5f"/>
<circle cx="400" cy="160" r="2.5" fill="#1e3a5f"/>
<!-- blinking cursor after name -->
<rect x="641" y="95" width="4" height="30" fill="#3B82F6" class="glow-anim"/>
</svg>
