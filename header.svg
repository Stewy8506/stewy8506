<svg width="100%" viewBox="0 0 860 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .window-bg {
        fill: #030712;
        stroke: #1f2937;
        stroke-width: 1.5;
        rx: 10px;
      }
      .window-header {
        fill: #0f172a;
        rx: 10px;
      }
      .window-title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        fill: #9ca3af;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .name-text {
        font-family: 'Syne', sans-serif;
        font-size: 58px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -2px;
      }
      .name-glow {
        font-family: 'Syne', sans-serif;
        font-size: 58px;
        font-weight: 800;
        fill: none;
        stroke: #3B82F6;
        stroke-width: 1.5;
        letter-spacing: -2px;
        filter: url(#neonGlow);
        opacity: 0.45;
        animation: breath 4s ease-in-out infinite;
      }
      @keyframes breath {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      .console-txt {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        fill: #60A5FA;
      }
      .console-dim {
        fill: #4b5563;
      }
      .console-green {
        fill: #10B981;
      }
      .grid-line {
        stroke: #111827;
        stroke-width: 1;
      }
      .grid-accent {
        stroke: #1e293b;
        stroke-width: 1.5;
      }
      
      /* Oscilloscope or visualizer wave */
      .wave {
        stroke: #3B82F6;
        stroke-width: 1.5;
        fill: none;
        stroke-dasharray: 800;
        stroke-dashoffset: 800;
        animation: drawWave 4s linear infinite;
        opacity: 0.75;
      }
      @keyframes drawWave {
        to { stroke-dashoffset: 0; }
      }

      /* Animated scanner line */
      .scanline {
        stroke: #06B6D4;
        stroke-width: 0.8;
        opacity: 0.15;
        animation: scan 3s ease-in-out infinite;
      }
      @keyframes scan {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(210px); }
      }

      /* Cursor blink */
      .cursor {
        fill: #06B6D4;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }

      .btn-red { fill: #FF5F56; }
      .btn-yellow { fill: #FFBD2E; }
      .btn-green { fill: #27C93F; }
    </style>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- macOS Window Box with Shadow -->
  <rect x="5" y="5" width="850" height="240" rx="10" fill="#000" opacity="0.3"/>
  <rect x="10" y="10" width="840" height="230" class="window-bg"/>
  <path d="M 10 20 A 10 10 0 0 1 20 10 L 840 10 A 10 10 0 0 1 850 20 L 850 42 L 10 42 Z" class="window-header"/>

  <!-- Window Dots (macOS style) -->
  <circle cx="28" cy="26" r="6" class="btn-red"/>
  <circle cx="48" cy="26" r="6" class="btn-yellow"/>
  <circle cx="68" cy="26" r="6" class="btn-green"/>

  <text x="430" y="30" class="window-title" text-anchor="middle">anuvab@macbook-pro-m3: ~/profile</text>

  <!-- HUD Grid Inside -->
  <g opacity="0.3">
    <!-- Vertical Grid Lines -->
    <line x1="100" y1="42" x2="100" y2="240" class="grid-line"/>
    <line x1="200" y1="42" x2="200" y2="240" class="grid-line"/>
    <line x1="300" y1="42" x2="300" y2="240" class="grid-line"/>
    <line x1="400" y1="42" x2="400" y2="240" class="grid-line"/>
    <line x1="500" y1="42" x2="500" y2="240" class="grid-line"/>
    <line x1="600" y1="42" x2="600" y2="240" class="grid-line"/>
    <line x1="700" y1="42" x2="700" y2="240" class="grid-line"/>
    <line x1="800" y1="42" x2="800" y2="240" class="grid-line"/>
    
    <!-- Horizontal Grid Lines -->
    <line x1="10" y1="80" x2="850" y2="80" class="grid-line"/>
    <line x1="10" y1="120" x2="850" y2="120" class="grid-line"/>
    <line x1="10" y1="160" x2="850" y2="160" class="grid-line"/>
    <line x1="10" y1="200" x2="850" y2="200" class="grid-line"/>

    <line x1="10" y1="140" x2="850" y2="140" class="grid-accent"/>
  </g>

  <!-- Live Oscilloscope wave -->
  <path d="M 10 140 Q 60 90 110 140 T 210 140 T 310 140 T 410 140 T 510 140 T 610 140 T 710 140 T 810 140 T 850 140" class="wave" stroke="url(#waveGrad)"/>

  <!-- Scanning indicator -->
  <line x1="10" y1="42" x2="850" y2="42" class="scanline"/>

  <!-- Console Outputs on the Side -->
  <g transform="translate(30, 75)">
    <text x="0" y="0" class="console-txt console-dim">&gt; Initializing diagnostics...</text>
    <text x="0" y="16" class="console-txt console-green">SYS.STATUS: ONLINE</text>
    <text x="0" y="32" class="console-txt">LOC: KOLKATA, INDIA</text>
    <text x="0" y="48" class="console-txt">TEMP: 26.8°C // STABLE</text>
  </g>

  <g transform="translate(670, 75)">
    <text x="0" y="0" class="console-txt console-dim">&gt; Fetching Git commit stats...</text>
    <text x="0" y="16" class="console-txt">COMMITS: active</text>
    <text x="0" y="32" class="console-txt console-green">ROLE: FULL-STACK &amp; IOT</text>
    <text x="0" y="48" class="console-txt">TARGET: build_and_ship()</text>
  </g>

  <!-- Name text with glow -->
  <g transform="translate(430, 150)">
    <text x="0" y="0" class="name-glow" text-anchor="middle">ANUVAB DAS</text>
    <text x="0" y="0" class="name-text" text-anchor="middle">ANUVAB DAS</text>
  </g>

  <!-- Title / Focus Ticker -->
  <g transform="translate(430, 185)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" fill="#06B6D4" font-weight="bold" letter-spacing="4px" text-anchor="middle">
      EMBEDDED  ·  SYSTEMS  ·  FULL-STACK  ·  AI
    </text>
  </g>

  <!-- Console prompt at the bottom -->
  <g transform="translate(30, 218)">
    <text x="0" y="0" class="console-txt"><tspan fill="#10B981">stewy8506@macbook</tspan>:<tspan fill="#3B82F6">~</tspan>$ npm run dev --profile</text>
    <rect x="315" y="-10" width="8" height="12" class="cursor"/>
  </g>
</svg>
