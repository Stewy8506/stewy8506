<svg width="100%" viewBox="0 0 860 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=JetBrains+Mono:wght@400;700&display=swap');
      
      .window-bg {
        fill: #030712;
        fill-opacity: 0.82;
        stroke: url(#glassBorder);
        stroke-width: 1.5;
        rx: 16px;
      }
      .window-header {
        fill: #090d16;
        fill-opacity: 0.9;
        rx: 16px;
      }
      .window-title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        fill: #4b5563;
        font-weight: 700;
        letter-spacing: 1px;
      }
      
      .hud-title {
        font-family: 'Outfit', sans-serif;
        font-size: 50px;
        font-weight: 900;
        fill: url(#textGrad);
        letter-spacing: 1px;
        filter: url(#textGlow);
      }
      .hud-subtitle {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        fill: #3b82f6;
        letter-spacing: 4px;
      }
      .txt-mono {
        font-family: 'JetBrains Mono', monospace;
        font-size: 7px;
        fill: #6b7280;
      }
      .txt-bold-mono {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8.5px;
        font-weight: bold;
      }
      
      /* Subtle backglows */
      .bg-glow-green {
        fill: #10B981;
        filter: url(#heavyGlow);
        opacity: 0.08;
        animation: breathGreen 8s ease-in-out infinite alternate;
      }
      .bg-glow-purple {
        fill: #8B5CF6;
        filter: url(#heavyGlow);
        opacity: 0.08;
        animation: breathPurple 8s ease-in-out infinite alternate-reverse;
      }
      
      @keyframes breathGreen {
        0% { transform: scale(1) translate(0, 0); opacity: 0.06; }
        100% { transform: scale(1.15) translate(-10px, 5px); opacity: 0.12; }
      }
      @keyframes breathPurple {
        0% { transform: scale(1.15) translate(0, 0); opacity: 0.06; }
        100% { transform: scale(1) translate(10px, -5px); opacity: 0.12; }
      }

      /* Dial meters */
      .dial-track {
        stroke: #111827;
        stroke-width: 4;
        fill: none;
      }
      .dial-fill-green {
        stroke: #10B981;
        stroke-width: 4;
        fill: none;
        stroke-dasharray: 188;
        stroke-dashoffset: 188;
        transform: rotate(-90deg);
        transform-origin: 110px 142px;
        animation: dialDrawGreen 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .dial-fill-purple {
        stroke: #8B5CF6;
        stroke-width: 4;
        fill: none;
        stroke-dasharray: 188;
        stroke-dashoffset: 188;
        transform: rotate(-90deg);
        transform-origin: 750px 142px;
        animation: dialDrawPurple 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes dialDrawGreen {
        from { stroke-dashoffset: 188; }
        to { stroke-dashoffset: 15; }
      }
      @keyframes dialDrawPurple {
        from { stroke-dashoffset: 188; }
        to { stroke-dashoffset: 38; }
      }

      /* Portfolio Interactive Button */
      .cta-btn {
        transition: all 0.3s ease;
      }
      .cta-btn:hover rect {
        fill: #111827;
        stroke: #60A5FA;
        filter: drop-shadow(0 0 4px rgba(96, 165, 250, 0.4));
      }
      .cta-btn:hover text {
        fill: #60A5FA;
      }
      
      .btn-red { fill: #FF5F56; }
      .btn-yellow { fill: #FFBD2E; }
      .btn-green { fill: #27C93F; }
      
      .corner-line {
        stroke: #1f2937;
        stroke-width: 1;
        stroke-opacity: 0.6;
        fill: none;
      }
    ]]></style>

    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" />
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="35%" stop-color="#3B82F6"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="glassBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#3B82F6" stop-opacity="0.06"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    
    <linearGradient id="glassBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.005"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f2937" stroke-width="0.6" stroke-opacity="0.18"/>
      <circle cx="30" cy="0" r="0.8" fill="#1f2937" fill-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Pitch Dark Background -->
  <rect width="860" height="250" fill="#020205"/>

  <!-- Tech Grid Background -->
  <rect width="860" height="250" fill="url(#grid)" />

  <!-- Ambient Glow Backdrops -->
  <circle cx="150" cy="130" r="90" class="bg-glow-green"/>
  <circle cx="710" cy="130" r="90" class="bg-glow-purple"/>

  <!-- Glassmorphic HUD Panel -->
  <rect x="15" y="15" width="830" height="220" class="window-bg" fill="url(#glassBg)" />
  <path d="M 15 31 A 16 16 0 0 1 31 15 L 829 15 A 16 16 0 0 1 845 31 L 845 48 L 15 48 Z" class="window-header"/>

  <!-- macOS Window Controls -->
  <circle cx="40" cy="31.5" r="5" class="btn-red"/>
  <circle cx="56" cy="31.5" r="5" class="btn-yellow"/>
  <circle cx="72" cy="31.5" r="5" class="btn-green"/>

  <!-- Title bar info -->
  <text x="430" y="35" class="window-title" text-anchor="middle">anuvab@macbook-pro-m3: ~/portfolio-terminal</text>

  <!-- HUD Corner Brackets -->
  <path d="M 30 68 L 30 58 L 40 58" class="corner-line"/>
  <path d="M 30 192 L 30 202 L 40 202" class="corner-line"/>
  <path d="M 830 68 L 830 58 L 820 58" class="corner-line"/>
  <path d="M 830 192 L 830 202 L 820 202" class="corner-line"/>

  <!-- ================= LEFT DIAL GAUGE (Embedded System Status) ================= -->
  <g>
    <!-- Dashed outer decoration -->
    <circle cx="110" cy="142" r="38" stroke="#1f2937" stroke-width="0.8" stroke-dasharray="3, 3" fill="none" />
    
    <!-- Dial Track and Fill -->
    <circle cx="110" cy="142" r="30" class="dial-track"/>
    <circle cx="110" cy="142" r="30" class="dial-fill-green"/>
    
    <!-- Value Inside -->
    <text x="110" y="146" font-family="'Outfit', sans-serif" font-size="12" fill="#ffffff" font-weight="900" text-anchor="middle">92%</text>
    
    <!-- Label and details below -->
    <text x="110" y="196" class="txt-bold-mono" fill="#10B981" text-anchor="middle">EMBEDDED / IoT</text>
    <text x="110" y="210" class="txt-mono" text-anchor="middle">SYS.LOAD: NOMINAL</text>
    <text x="110" y="219" class="txt-mono" text-anchor="middle">ACTIVE NODES: 04</text>
  </g>

  <!-- ================= CENTER NAME & DETAILED INFO ================= -->
  <g>
    <!-- System Status Bar -->
    <text x="430" y="80" font-family="'JetBrains Mono', monospace" font-size="8" fill="#4b5563" font-weight="bold" letter-spacing="3.5px" text-anchor="middle">STATUS: ACTIVE // STACK: ESP32 • RUST • REACT NATIVE • AI</text>
    
    <!-- Hero Title -->
    <text x="430" y="128" class="hud-title" text-anchor="middle">ANUVAB DAS</text>
    
    <!-- Subtitle -->
    <text x="430" y="153" class="hud-subtitle" text-anchor="middle">CREATIVE CODE &amp; CIRCUITS</text>

    <!-- Interactive CTA link -->
    <a href="https://anvv.tech" target="_blank" style="cursor: pointer;">
      <g class="cta-btn">
        <rect x="310" y="174" width="240" height="26" rx="13" fill="#090d16" fill-opacity="0.8" stroke="#1f2937" stroke-opacity="0.8" stroke-width="1.2"/>
        <text x="430" y="190" font-family="'JetBrains Mono', monospace" font-size="9" fill="#06B6D4" font-weight="bold" text-anchor="middle">→ click to visit anvv.tech _</text>
      </g>
    </a>
  </g>

  <!-- ================= RIGHT DIAL GAUGE (Software/AI Status) ================= -->
  <g>
    <!-- Dashed outer decoration -->
    <circle cx="750" cy="142" r="38" stroke="#1f2937" stroke-width="0.8" stroke-dasharray="3, 3" fill="none" />
    
    <!-- Dial Track and Fill -->
    <circle cx="750" cy="142" r="30" class="dial-track"/>
    <circle cx="750" cy="142" r="30" class="dial-fill-purple"/>
    
    <!-- Value Inside -->
    <text x="750" y="146" font-family="'Outfit', sans-serif" font-size="12" fill="#ffffff" font-weight="900" text-anchor="middle">80%</text>

    <!-- Label and details below -->
    <text x="750" y="196" class="txt-bold-mono" fill="#8B5CF6" text-anchor="middle">SOFTWARE / AI</text>
    <text x="750" y="210" class="txt-mono" text-anchor="middle">STAGE: PRODUCTION</text>
    <text x="750" y="219" class="txt-mono" text-anchor="middle">MODULES: ACTIVE (12)</text>
  </g>

</svg>
