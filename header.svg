<svg width="100%" viewBox="0 0 860 240" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');

    .name {
      font-family: 'Syne', sans-serif;
      font-size: 72px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -3px;
    }
    .name-glow {
      font-family: 'Syne', sans-serif;
      font-size: 72px;
      font-weight: 800;
      fill: none;
      stroke: #3B82F6;
      stroke-width: 0.5;
      letter-spacing: -3px;
      filter: url(#neonBlur);
      opacity: 0.6;
      animation: namePulse 4s ease-in-out infinite;
    }
    @keyframes namePulse { 0%,100%{opacity:0.3} 50%{opacity:0.8} }

    .sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 4px;
      fill: #60A5FA;
    }
    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      fill: #1e3a5f;
      letter-spacing: 3px;
    }
    .bracket { stroke: #3B82F6; stroke-width: 1.5; fill: none; }

    /* Circuit traces */
    .trace { stroke: #0d1f3c; stroke-width: 0.5; fill: none; }
    .trace-hot { stroke: #1e3a5f; stroke-width: 0.8; fill: none; }
    .trace-live {
      stroke: #3B82F6;
      stroke-width: 1;
      fill: none;
      stroke-dasharray: 6 4;
      animation: flowDash 1.8s linear infinite;
    }
    .trace-live2 {
      stroke: #60A5FA;
      stroke-width: 0.8;
      fill: none;
      stroke-dasharray: 4 6;
      animation: flowDash 2.4s linear infinite reverse;
    }
    @keyframes flowDash { to { stroke-dashoffset: -40; } }

    /* Nodes */
    .node { fill: #3B82F6; }
    .node-dim { fill: #1e3a5f; }
    .node-pulse {
      fill: #3B82F6;
      animation: nodePulse 2.5s ease-in-out infinite;
    }
    @keyframes nodePulse { 0%,100%{r:3;opacity:1} 50%{r:5.5;opacity:0.3} }

    /* Scan line */
    .scan {
      fill: none;
      stroke: #3B82F6;
      stroke-width: 1;
      opacity: 0;
      animation: scanMove 6s ease-in-out infinite;
    }
    @keyframes scanMove {
      0%   { transform: translateY(0px); opacity: 0; }
      10%  { opacity: 0.15; }
      90%  { opacity: 0.15; }
      100% { transform: translateY(240px); opacity: 0; }
    }

    /* Glitch effect */
    .glitch1 {
      font-family: 'Syne', sans-serif;
      font-size: 72px;
      font-weight: 800;
      fill: #60A5FA;
      letter-spacing: -3px;
      opacity: 0;
      animation: glitch1 7s ease-in-out infinite;
    }
    .glitch2 {
      font-family: 'Syne', sans-serif;
      font-size: 72px;
      font-weight: 800;
      fill: #f87171;
      letter-spacing: -3px;
      opacity: 0;
      animation: glitch2 7s ease-in-out infinite;
    }
    @keyframes glitch1 {
      0%,94%,100%{opacity:0;transform:translate(0,0)}
      95%{opacity:0.5;transform:translate(-4px,1px)}
      96%{opacity:0;transform:translate(0,0)}
      97%{opacity:0.3;transform:translate(3px,-1px)}
      98%{opacity:0}
    }
    @keyframes glitch2 {
      0%,94%,100%{opacity:0;transform:translate(0,0)}
      95%{opacity:0.4;transform:translate(4px,-1px)}
      96%{opacity:0;transform:translate(0,0)}
      97%{opacity:0.2;transform:translate(-3px,2px)}
      98%{opacity:0}
    }

    /* Status dot */
    .status-dot {
      fill: #22c55e;
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* Particle dots */
    .particle { fill: #3B82F6; animation: particleFade 3s ease-in-out infinite; }
    .p-d1 { animation-delay: 0s; }
    .p-d2 { animation-delay: 0.4s; }
    .p-d3 { animation-delay: 0.8s; }
    .p-d4 { animation-delay: 1.2s; }
    .p-d5 { animation-delay: 1.6s; }
    .p-d6 { animation-delay: 2.0s; }
    .p-d7 { animation-delay: 2.4s; }
    .p-d8 { animation-delay: 2.8s; }
    @keyframes particleFade { 0%,100%{opacity:0.1} 50%{opacity:0.9} }

    /* Shimmer overlay */
    .shimmer-line { stroke: #3B82F6; stroke-width: 0.3; opacity: 0.04; }
  </style>

  <filter id="neonBlur">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/></feMerge>
  </filter>
  <filter id="softGlow">
    <feGaussianBlur stdDeviation="2" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020608"/>
    <stop offset="50%" stop-color="#060a10"/>
    <stop offset="100%" stop-color="#040812"/>
  </linearGradient>
  <linearGradient id="horizLine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#060a10"/>
    <stop offset="20%" stop-color="#1e3a5f"/>
    <stop offset="50%" stop-color="#3B82F6"/>
    <stop offset="80%" stop-color="#1e3a5f"/>
    <stop offset="100%" stop-color="#060a10"/>
  </linearGradient>
  <linearGradient id="subGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1e3a5f"/>
    <stop offset="40%" stop-color="#60A5FA"/>
    <stop offset="60%" stop-color="#93C5FD"/>
    <stop offset="100%" stop-color="#1e3a5f"/>
  </linearGradient>
  <clipPath id="mainClip">
    <rect width="860" height="240"/>
  </clipPath>
</defs>

<!-- Background -->
<rect width="860" height="240" fill="url(#bgGrad)"/>

<!-- Fine grid -->
<g clip-path="url(#mainClip)" opacity="0.4">
  <line x1="0" y1="30" x2="860" y2="30" class="trace"/>
  <line x1="0" y1="60" x2="860" y2="60" class="trace"/>
  <line x1="0" y1="90" x2="860" y2="90" class="trace"/>
  <line x1="0" y1="120" x2="860" y2="120" class="trace"/>
  <line x1="0" y1="150" x2="860" y2="150" class="trace"/>
  <line x1="0" y1="180" x2="860" y2="180" class="trace"/>
  <line x1="0" y1="210" x2="860" y2="210" class="trace"/>
  <line x1="86" y1="0" x2="86" y2="240" class="trace"/>
  <line x1="172" y1="0" x2="172" y2="240" class="trace"/>
  <line x1="258" y1="0" x2="258" y2="240" class="trace"/>
  <line x1="344" y1="0" x2="344" y2="240" class="trace"/>
  <line x1="430" y1="0" x2="430" y2="240" class="trace"/>
  <line x1="516" y1="0" x2="516" y2="240" class="trace"/>
  <line x1="602" y1="0" x2="602" y2="240" class="trace"/>
  <line x1="688" y1="0" x2="688" y2="240" class="trace"/>
  <line x1="774" y1="0" x2="774" y2="240" class="trace"/>
</g>

<!-- Scan line -->
<line x1="0" y1="0" x2="860" y2="0" class="scan"/>

<!-- Left circuit cluster -->
<polyline points="0,80 50,80 50,120 90,120" class="trace-hot"/>
<polyline points="0,160 40,160 40,120 90,120" class="trace-hot"/>
<polyline points="90,120 130,120" class="trace-live"/>
<polyline points="0,40 30,40 30,60 50,60 50,80" class="trace"/>
<circle cx="50" cy="80" r="2" class="node-dim"/>
<circle cx="90" cy="120" r="3" class="node-dim"/>
<circle cx="130" cy="120" r="3.5" class="node-pulse"/>

<!-- Right circuit cluster -->
<polyline points="860,80 810,80 810,120 770,120" class="trace-hot"/>
<polyline points="860,160 820,160 820,120 770,120" class="trace-hot"/>
<polyline points="770,120 730,120" class="trace-live2"/>
<polyline points="860,40 830,40 830,60 810,60 810,80" class="trace"/>
<circle cx="810" cy="80" r="2" class="node-dim"/>
<circle cx="770" cy="120" r="3" class="node-dim"/>
<circle cx="730" cy="120" r="3.5" class="node-pulse"/>

<!-- Top circuit traces -->
<polyline points="220,0 220,30 260,30 260,60" class="trace-hot"/>
<polyline points="640,0 640,30 600,30 600,60" class="trace-hot"/>
<circle cx="260" cy="60" r="2.5" class="node"/>
<circle cx="600" cy="60" r="2.5" class="node"/>

<!-- Particle scatter dots -->
<circle cx="172" cy="90" r="1.5" class="particle p-d1"/>
<circle cx="258" cy="60" r="1.5" class="particle p-d2"/>
<circle cx="344" cy="150" r="1.5" class="particle p-d3"/>
<circle cx="430" cy="30" r="2" class="particle p-d4"/>
<circle cx="516" cy="180" r="1.5" class="particle p-d5"/>
<circle cx="602" cy="90" r="1.5" class="particle p-d6"/>
<circle cx="688" cy="150" r="1.5" class="particle p-d7"/>
<circle cx="774" cy="60" r="1.5" class="particle p-d8"/>

<!-- Top system label -->
<text x="430" y="24" class="tag" text-anchor="middle">SYSTEM_ONLINE  ·  v3.0  ·  KOLKATA, IN  ·  EST. 2003</text>

<!-- Glitch layers (behind name) -->
<text x="430" y="150" class="glitch1" text-anchor="middle">ANUVAB DAS</text>
<text x="430" y="150" class="glitch2" text-anchor="middle">ANUVAB DAS</text>

<!-- Neon outline glow -->
<text x="430" y="150" class="name-glow" text-anchor="middle" filter="url(#neonBlur)">ANUVAB DAS</text>

<!-- Main name -->
<text x="430" y="150" class="name" text-anchor="middle">ANUVAB DAS</text>

<!-- Subtitle with gradient -->
<text x="430" y="178" class="sub" text-anchor="middle" fill="url(#subGrad)">IoT  ·  ROBOTICS  ·  FULL-STACK  ·  PCB</text>

<!-- Status indicator -->
<circle cx="320" cy="174" r="3" class="status-dot"/>
<text x="310" y="178" font-family="JetBrains Mono,monospace" font-size="8" fill="#22c55e" text-anchor="end">ACTIVELY BUILDING</text>

<!-- Horizontal accent line -->
<line x1="100" y1="196" x2="760" y2="196" stroke="url(#horizLine)" stroke-width="0.8"/>

<!-- Corner brackets -->
<polyline points="18,14 8,14 8,32" class="bracket"/>
<polyline points="842,14 852,14 852,32" class="bracket"/>
<polyline points="18,226 8,226 8,208" class="bracket"/>
<polyline points="842,226 852,226 852,208" class="bracket"/>

<!-- Bottom label -->
<text x="430" y="222" class="tag" text-anchor="middle">[ HARDWARE  ×  SOFTWARE  ×  CLOUD ]</text>
</svg>
